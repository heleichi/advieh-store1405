<!DOCTYPE html>
<html lang="fa" dir="rtl">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>🌶️ طعم‌یار | فروشگاه ادویه</title>  
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">  
    <style>  
        :root {  
            --bg: #f7f5f2; --text: #1a1815; --text-light: #6b6560;  
            --accent: #c0392b; --accent-hover: #a93226; --secondary: #8B4513;  
            --gold: #D4A017; --green: #27ae60; --cream: #f5ede3; --border: #e8ddd0;  
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04); --shadow-md: 0 4px 16px rgba(0,0,0,0.08);  
            --radius: 14px; --radius-sm: 10px; --radius-lg: 22px;  
            --font: 'Vazirmatn', sans-serif; --bottom-nav-height: 64px;  
        }  
        * { margin: 0; padding: 0; box-sizing: border-box; }  
        body {  
            font-family: var(--font); background: var(--bg); color: var(--text);  
            line-height: 1.7; min-height: 100vh; overflow-x: hidden;  
            padding-bottom: var(--bottom-nav-height);  
        }  
        body.admin-mode { padding-bottom: 0; background: #f0f0f0; }
        body.admin-mode .top-header, body.admin-mode .bottom-nav { display: none; }

        a { text-decoration: none; color: inherit; }  
        button { cursor: pointer; font-family: var(--font); border: none; outline: none; transition: 0.2s; background: none; }  
        input, select, textarea {  
            font-family: var(--font); outline: none; border: 1.5px solid var(--border);  
            border-radius: var(--radius-sm); padding: 10px 14px; font-size: 0.95rem;  
            transition: 0.2s; background: #fff; width: 100%;  
        }  
        input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(192,57,43,0.08); }  
        input:disabled, select:disabled { background: #f0f0f0; color: #999; cursor: not-allowed; }

        .container { max-width: 600px; margin: 0 auto; padding: 0 12px; }  
        body.admin-mode .container { max-width: 100%; padding: 0 16px; }

        .page-section { display: none; animation: fadeIn 0.3s ease-in-out; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .top-header {  
            background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000;  
            padding: 8px 12px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow-sm); height: 60px;  
        }  
        .top-header .logo { font-size: 1.4rem; font-weight: 900; color: var(--accent); display: flex; align-items: center; gap: 6px; }  
        .top-header .search-box { flex: 1; background: var(--cream); border-radius: 50px; padding: 6px 12px; display: flex; align-items: center; gap: 8px; }  
        .top-header .search-box input { border: none; background: transparent; padding: 4px 0; font-size: 0.9rem; width: 100%; }  

        .header-logout-btn {
            background: var(--accent); color: #fff; padding: 6px 12px;
            border-radius: 20px; font-size: 0.8rem; font-weight: 600;
            display: none; align-items: center; gap: 4px;
        }
        .header-logout-btn.visible { display: flex; }

        .bottom-nav {  
            position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border);  
            display: flex; justify-content: space-around; align-items: center; height: var(--bottom-nav-height); z-index: 1000;  
            box-shadow: 0 -2px 12px rgba(0,0,0,0.06);  
        }  
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.7rem; color: var(--text-light); padding: 4px 8px; border-radius: 12px; min-width: 56px; cursor: pointer; position: relative; }  
        .bottom-nav-item i { font-size: 1.3rem; }  
        .bottom-nav-item.active { color: var(--accent); background: rgba(192,57,43,0.06); }  
        .bottom-nav-item .badge { position: absolute; top: 2px; right: 12px; background: var(--accent); color: #fff; font-size: 0.65rem; width: 16px; height: 16px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: 700; }  

        .admin-top-bar { display: none; background: linear-gradient(135deg, #1f140e 0%, #3a2417 100%); color: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 1000; align-items: center; gap: 12px; }
        body.admin-mode .admin-top-bar { display: flex; }
        .admin-top-bar .admin-logo { font-size: 1.1rem; font-weight: 800; color: var(--gold); flex: 1; }
        .admin-top-bar-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 12px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }

        .admin-sidebar { position: fixed; top: 0; right: -300px; width: 300px; height: 100%; background: #1f140e; color: #fff; z-index: 2000; transition: right 0.3s; padding: 16px; overflow-y: auto; }  
        .admin-sidebar.open { right: 0; }  
        .admin-sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }  
        .admin-sidebar-header h3 { color: var(--gold); }
        .admin-sidebar .close-btn { color: #aaa; font-size: 1.4rem; cursor: pointer; }
        .admin-sidebar a { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--radius-sm); color: #ddd; margin-bottom: 4px; cursor: pointer; }  
        .admin-sidebar a:hover { background: rgba(255,255,255,0.1); color: #fff; }  
        .admin-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1500; display: none; }  
        .admin-backdrop.show { display: block; }  

        .home-hero-banner { background: linear-gradient(135deg, #3a2417, #6b3a1f); border-radius: var(--radius-lg); padding: 20px 16px; margin: 16px 0; color: #fff; text-align: center; }  
        .section-header { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 12px; }  
        .section-header h3 { font-size: 1.1rem; font-weight: 800; }  
        .section-header a { font-size: 0.8rem; color: var(--accent); }  

        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }  
        .product-card { background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border); cursor: pointer; }  
        .product-image { height: 130px; background: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; position: relative; overflow: hidden; }  
        .product-image img { width: 100%; height: 100%; object-fit: cover; }
        .product-body { padding: 10px 12px; }  
        .product-name { font-weight: 700; font-size: 0.9rem; }  
        .product-price { font-weight: 800; color: var(--accent); font-size: 0.95rem; }  
        .product-price .original { text-decoration: line-through; color: var(--text-light); font-size: 0.8rem; margin-left: 4px; }  
        
        .weight-options { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
        .weight-options button { background: var(--cream); border-radius: 20px; padding: 4px 10px; font-size: 0.72rem; font-weight: 600; border: 1px solid transparent; position: relative; transition: 0.2s; }
        .weight-options button.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
        .weight-options button:disabled { background: #f0f0f0; color: #999; cursor: not-allowed; opacity: 0.6; }
        .weight-options button .discount-badge-weight { position: absolute; top: -6px; right: -6px; background: var(--gold); color: #333; font-size: 0.6rem; padding: 1px 4px; border-radius: 8px; font-weight: 700; }
        .weight-options button .out-of-stock { position: absolute; top: -6px; right: -6px; background: #e74c3c; color: #fff; font-size: 0.55rem; padding: 1px 4px; border-radius: 8px; font-weight: 700; }

        .add-to-cart-btn { background: var(--accent); color: #fff; padding: 8px 12px; border-radius: 30px; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 8px; width: 100%; }  
        .add-to-cart-btn.added { background: var(--green); }  
        .add-to-cart-btn:disabled { background: #95a5a6; cursor: not-allowed; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 16px; }  
        .modal { background: #fff; border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative; }  
        .modal-close { position: absolute; top: 16px; left: 16px; font-size: 1.3rem; color: var(--text-light); cursor: pointer; }  

        .toast-container { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 4000; display: flex; flex-direction: column; gap: 8px; }  
        .toast { padding: 10px 20px; border-radius: 30px; background: #333; color: #fff; font-size: 0.85rem; }  
        .toast.success { background: var(--green); } .toast.error { background: #e74c3c; }

        .btn { padding: 10px 18px; border-radius: 30px; font-weight: 700; font-size: 0.9rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }  
        .btn-primary { background: var(--accent); color: #fff; }  
        .btn-secondary { background: var(--cream); color: var(--text); } .btn-danger { background: #e74c3c; color: #fff; }  
        .btn-sm { padding: 6px 12px; font-size: 0.75rem; border-radius: 20px; } .btn-block { width: 100%; }  

        .login-box { background: #fff; border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-md); margin: 20px auto; max-width: 420px; }
        .login-box h3 { text-align: center; margin-bottom: 16px; color: var(--accent); }
        
        .credentials-box { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: var(--radius-lg); padding: 24px; margin: 20px 0; color: #fff; text-align: center; }
        .credentials-box h4 { margin-bottom: 16px; }
        .credential-item { background: rgba(255,255,255,0.2); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 12px; position: relative; }
        .credential-label { font-size: 0.85rem; opacity: 0.9; margin-bottom: 4px; }
        .credential-value { font-size: 1.3rem; font-weight: 800; font-family: monospace; }
        .copy-btn { position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.3); border: none; color: #fff; padding: 4px 8px; border-radius: 12px; cursor: pointer; font-size: 0.75rem; }

        .generate-btn { background: var(--green); color: #fff; padding: 12px 20px; border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 700; cursor: pointer; margin: 12px 0; width: 100%; }
        .generate-btn:hover { background: #229954; }

        .kitchen-hero { background: linear-gradient(135deg, #e67e22 0%, #d35400 100%); border-radius: var(--radius-lg); padding: 28px 20px; margin: 18px 0; color: #fff; text-align: center; }
        .kitchen-hero h2 { font-size: 1.6rem; font-weight: 900; margin-bottom: 8px; }

        .kitchen-shelves { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .kitchen-shelf { background: linear-gradient(135deg, #fff 0%, var(--cream) 100%); border-radius: var(--radius); padding: 18px 12px; text-align: center; cursor: pointer; border: 2px solid var(--border); }
        .kitchen-shelf.active { border-color: var(--accent); }
        .kitchen-shelf .shelf-icon { font-size: 2.5rem; }
        .kitchen-shelf .shelf-name { font-weight: 800; font-size: 0.95rem; }
        .kitchen-shelf .shelf-count { font-size: 0.75rem; color: var(--text-light); }

        .recipe-card { background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 14px; cursor: pointer; }
        .recipe-image { height: 160px; background: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 4rem; position: relative; overflow: hidden; }
        .recipe-image img { width: 100%; height: 100%; object-fit: cover; }
        .recipe-category-badge { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.95); padding: 4px 10px; border-radius: 15px; font-size: 0.75rem; font-weight: 700; }
        .recipe-body { padding: 14px; }
        .recipe-title { font-weight: 800; font-size: 1.05rem; margin-bottom: 6px; }
        .recipe-desc { font-size: 0.88rem; color: var(--text-light); margin-bottom: 10px; line-height: 1.6; }
        .recipe-spices { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
        .spice-tag { background: var(--cream); color: var(--secondary); padding: 5px 10px; border-radius: 18px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
        .spice-tag:hover { background: var(--accent); color: #fff; }
        .recipe-meta { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--text-light); }

        .recipe-detail-section { margin-bottom: 18px; }
        .recipe-detail-section h4 { color: var(--secondary); font-size: 1.05rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .recipe-detail-section ul { list-style: none; }
        .recipe-detail-section ul li { padding: 7px 0; border-bottom: 1px dashed var(--border); display: flex; align-items: center; gap: 10px; }
        .recipe-detail-section ul li i { color: var(--green); }
        .recipe-detail-section ol { padding-right: 20px; }
        .recipe-detail-section ol li { padding: 9px 0; border-bottom: 1px dashed var(--border); line-height: 1.8; }

        .spice-uses-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .spice-use-card { background: var(--cream); padding: 12px; border-radius: var(--radius-sm); text-align: center; cursor: pointer; border: 2px solid transparent; }
        .spice-use-card:hover { border-color: var(--accent); }
        .spice-use-card i { font-size: 1.8rem; color: var(--accent); margin-bottom: 6px; }
        .spice-use-card h5 { font-size: 0.9rem; font-weight: 700; margin-bottom: 3px; }

        .recipe-spice-item { background: var(--cream); padding: 12px; border-radius: var(--radius-sm); display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .recipe-spice-item .spice-info { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; }

        .detail-hero { width: 100%; height: 200px; background: var(--cream); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 4rem; margin-bottom: 16px; overflow: hidden; }
        .detail-hero img { width: 100%; height: 100%; object-fit: cover; }
        .detail-section { margin-bottom: 16px; }
        .detail-section h4 { color: var(--secondary); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .uses-list { list-style: none; }
        .uses-list li { padding: 6px 0; border-bottom: 1px dashed var(--border); display: flex; align-items: center; gap: 8px; }
        .uses-list li i { color: var(--green); }

        .checkout-summary { background: var(--cream); padding: 16px; border-radius: var(--radius-sm); margin: 16px 0; }
        .checkout-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .checkout-row.total { font-weight: 800; font-size: 1.1rem; color: var(--accent); border-top: 2px solid var(--border); padding-top: 8px; margin-top: 8px; }

        .credentials-display { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); border-radius: var(--radius-lg); padding: 20px; margin: 16px 0; color: #fff; }
        .credentials-display h4 { margin-bottom: 12px; }
        .cred-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.2); padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 8px; }
        .cred-row .label { font-size: 0.85rem; opacity: 0.9; }
        .cred-row .value { font-size: 1.1rem; font-weight: 800; font-family: monospace; }
        .cred-copy { background: rgba(255,255,255,0.3); border: none; color: #fff; padding: 6px 10px; border-radius: 12px; cursor: pointer; }

        .eitaa-warning { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); border-radius: var(--radius-lg); padding: 30px 20px; margin: 20px 0; color: #fff; text-align: center; }
        .eitaa-warning h2 { font-size: 1.5rem; margin-bottom: 16px; }
        .eitaa-warning .btn { background: #fff; color: #e74c3c; font-weight: 800; }

        .empty-state { text-align: center; padding: 30px 16px; color: var(--text-light); }
        .empty-state i { font-size: 2.5rem; margin-bottom: 8px; display: block; }

        .stock-manager { background: var(--cream); padding: 12px; border-radius: var(--radius-sm); margin-top: 12px; }

        .backup-section { background: #fff; border-radius: var(--radius-sm); padding: 16px; box-shadow: var(--shadow-sm); margin-bottom: 12px; }
        .backup-section h4 { margin-bottom: 12px; color: var(--accent); }
        .backup-btn { background: var(--green); color: #fff; padding: 10px 16px; border-radius: var(--radius-sm); border: none; cursor: pointer; font-family: var(--font); font-weight: 700; margin: 4px; }
        .backup-btn.restore { background: var(--accent); }
        .backup-btn.download { background: #3498db; }
        .backup-btn.reset { background: #e74c3c; }

        .product-image-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: var(--radius-sm); margin-top: 8px; }
        .image-upload-area { border: 2px dashed var(--border); border-radius: var(--radius-sm); padding: 20px; text-align: center; cursor: pointer; margin-top: 8px; }
        .image-upload-area:hover { border-color: var(--accent); }

        .category-item-admin { background: #fff; border-radius: var(--radius-sm); padding: 12px; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .category-item-admin .cat-icon-preview { font-size: 2rem; }
    </style>
</head>  
<body>  
    <div class="toast-container" id="toastContainer"></div>  

    <header class="top-header">  
        <a href="javascript:void(0)" onclick="showPage('home')" class="logo"><i class="fa-solid fa-mortar-pestle"></i> طعم‌یار</a>  
        <div class="search-box">  
            <i class="fa-solid fa-search"></i>  
            <input type="text" id="globalSearchInput" placeholder="جستجوی ادویه..." oninput="handleGlobalSearch(this.value)">  
        </div>  
        <button class="header-logout-btn" id="headerLogoutBtn" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i> خروج
        </button>
    </header>  

    <div class="admin-top-bar">
        <button class="admin-top-bar-btn" onclick="toggleAdminSidebar()"><i class="fa-solid fa-bars"></i> منو</button>
        <div class="admin-logo"><i class="fa-solid fa-shield-halved"></i> پنل مدیریت</div>
        <button class="admin-top-bar-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
    </div>

    <main class="container" id="mainContent">  
        <section class="page-section active" id="page-home">  
            <div class="home-hero-banner">  
                <h2>🌟 ادویه‌های تازه و خوش‌عطر 🌟</h2>  
                <p>کیفیت بی‌نظیر، طعم اصیل، قیمت مناسب</p>  
                <button class="btn btn-primary btn-sm" onclick="showPage('shop')" style="margin-top:12px">🛍️ مشاهده محصولات</button>  
            </div>  
            <div class="section-header"><h3>محصولات</h3></div>  
            <div class="product-grid" id="homeFeaturedProducts"></div>  
        </section>  
        <section class="page-section" id="page-shop">  
            <div class="section-header"><h3>🛍️ فروشگاه</h3><a href="javascript:void(0)" onclick="showPage('home')">بازگشت</a></div>  
            <div class="product-grid" id="shopProducts"></div>  
        </section>  
        <section class="page-section" id="page-kitchen"><div id="kitchenContent"></div></section>
        <section class="page-section" id="page-cart">  
            <div class="section-header"><h3>🛒 سبد خرید</h3><a href="javascript:void(0)" onclick="showPage('shop')">بازگشت</a></div>  
            <div id="cartContent"></div>  
        </section>  
        <section class="page-section" id="page-login"><div id="loginContainer"></div></section>
        <section class="page-section" id="page-eitaa-warning"><div id="eitaaWarningContainer"></div></section>
        <section class="page-section" id="page-user-dashboard"><div id="userDashboardContent"></div></section>  
        <section class="page-section" id="page-admin"><div id="adminTabContent"></div></section>  
    </main>  

    <nav class="bottom-nav" id="bottomNav">  
        <a href="javascript:void(0)" class="bottom-nav-item active" onclick="showPage('home')"><i class="fa-solid fa-house"></i><span>خانه</span></a>  
        <a href="javascript:void(0)" class="bottom-nav-item" onclick="showPage('shop')"><i class="fa-solid fa-store"></i><span>فروشگاه</span></a>  
        <a href="javascript:void(0)" class="bottom-nav-item" onclick="showPage('kitchen')"><i class="fa-solid fa-utensils"></i><span>آشپزخانه</span></a>
        <a href="javascript:void(0)" class="bottom-nav-item" onclick="showPage('cart')"><i class="fa-solid fa-shopping-cart"></i><span>سبد</span><span class="badge" id="bottomCartBadge">0</span></a>  
        <a href="javascript:void(0)" class="bottom-nav-item" onclick="showPage('user-dashboard')"><i class="fa-solid fa-user"></i><span>حساب</span></a>  
    </nav>  

    <div class="admin-backdrop" id="adminBackdrop" onclick="toggleAdminSidebar()"></div>  
    <div class="admin-sidebar" id="adminSidebar">  
        <div class="admin-sidebar-header">
            <h3><i class="fa-solid fa-shield-halved"></i> مدیریت</h3>
            <button class="close-btn" onclick="toggleAdminSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>  
        <a href="javascript:void(0)" onclick="showAdminTab('overview'); toggleAdminSidebar();"><i class="fa-solid fa-chart-pie"></i> نمای کلی</a>

        let state = {  
            users: [], currentUser: null, products: [], orders: [], cart: [],  
            discounts: [], recipes: [], messages: [],
            settings: { shippingCost: 35000, vatPercent: 9, storeCardNumber: '6037991122334455', storeCardName: 'فروشگاه طعم‌یار', adminChatId: EITAA_CHANNEL_ID },
            activePage: 'home', kitchenShelf: 'all', userTab: 'profile', adminTab: 'overview', selectedWeight: {}, appliedDiscount: null
        };  

        function saveState() { try { localStorage.setItem('tamYar_v12', JSON.stringify(state)); } catch(e) {} }  
        function loadState() {  
            try {  
                const saved = localStorage.getItem('tamYar_v12');  
                if (saved) {  
                    const parsed = JSON.parse(saved);  
                    state = { ...state, ...parsed };  
                    if (!state.settings) state.settings = { shippingCost: 35000, vatPercent: 9, storeCardNumber: '', storeCardName: '', adminChatId: EITAA_CHANNEL_ID };
                    if (!state.settings.adminChatId) state.settings.adminChatId = EITAA_CHANNEL_ID;
                    if (!Array.isArray(state.users)) state.users = [];  
                    if (!Array.isArray(state.products) || state.products.length === 0) state.products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));  
                    if (!Array.isArray(state.recipes) || state.recipes.length === 0) state.recipes = ALL_RECIPES;
                    if (!Array.isArray(state.orders)) state.orders = [];  
                    if (!Array.isArray(state.cart)) state.cart = [];  
                    if (!Array.isArray(state.discounts)) state.discounts = [];  
                    if (!Array.isArray(state.messages)) state.messages = [];  
                } else { initDefaultState(); }  
            } catch(e) { initDefaultState(); }  
            if (!state.users.find(u => u.role === 'admin')) {  
                state.users.push({ id: 'admin_local', userId: 0, name: 'مدیر', phone: '09120000000', role: 'admin', address: '', postalCode: '', city: '', firstPurchaseDone: true, createdAt: Date.now() });  
            }  
            saveState();  
        }  
        function initDefaultState() {  
            state.users = [{ id: 'admin_local', userId: 0, name: 'مدیر', phone: '09120000000', role: 'admin', address: '', postalCode: '', city: '', firstPurchaseDone: true, createdAt: Date.now() }];  
            state.products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));  
            state.recipes = ALL_RECIPES;
            state.orders = []; state.cart = []; state.discounts = []; state.messages = [];
            saveState();  
        }  

        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2,5); }  
        
        function generateUserCode() { 
            const rand = Math.floor(1000 + Math.random() * 9000);
            return `taamyar-${rand}`; 
        }
        
        function generatePassword() { return Math.random().toString(36).substr(2, 8); }
        function formatPrice(p) { return (p || 0).toLocaleString('fa-IR'); }  
        function showToast(msg, type='info') {  
            const c = document.getElementById('toastContainer'); if (!c) return;  
            const t = document.createElement('div'); t.className = `toast ${type}`; t.textContent = msg;  
            c.appendChild(t); setTimeout(() => t.remove(), 3000);  
        }  
        function getProductById(id) { return state.products.find(p => p.id === id); }  
        function getRecipeById(id) { return state.recipes.find(r => r.id === id); }
        
        function getWeightById(product, weightId) {
            return product.weights.find(w => w.id === weightId);
        }
        
        function isWeightAvailable(product, weightId) {
            const w = getWeightById(product, weightId);
            if (!w) return false;
            return w.stock !== 0;
        }
        
        function getEffectivePrice(product, weightId) {  
            const w = getWeightById(product, weightId);
            if (!w) return 0;
            const discount = weightId === 'w1' ? (product.discount100 || 0) : (product.discount250 || 0);
            return discount > 0 ? Math.round(w.price * (1 - discount/100)) : w.price;  
        }  

        function applyLayoutMode() {
            if (state.currentUser && state.currentUser.role === 'admin') document.body.classList.add('admin-mode');
            else document.body.classList.remove('admin-mode');
        }

        function updateHeaderLogoutButton() {
            const logoutBtn = document.getElementById('headerLogoutBtn');
            if (logoutBtn) {
                if (state.currentUser && state.currentUser.userCode) {
                    logoutBtn.classList.add('visible');
                } else {
                    logoutBtn.classList.remove('visible');
                }
            }
        }

        function showPage(page) {  
            if (!isFromEitaa && !eitaaUser && page !== 'eitaa-warning' && page !== 'login') {
                page = 'eitaa-warning';
            }
            
            state.activePage = page;  
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));  
            const el = document.getElementById(`page-${page}`); if (el) el.classList.add('active');  
            if (!state.currentUser || state.currentUser.role !== 'admin') {
                document.querySelectorAll('.bottom-nav-item').forEach(b => b.classList.remove('active'));  
                const navMap = { home: 0, shop: 1, kitchen: 2, cart: 3, 'user-dashboard': 4 };  
                if (navMap[page] !== undefined) {  
                    const items = document.querySelectorAll('.bottom-nav-item');  
                    if (items[navMap[page]]) items[navMap[page]].classList.add('active');  
                }  
            }
            if (page === 'home') renderHome();  
            else if (page === 'shop') renderShop();  
            else if (page === 'kitchen') renderKitchen();
            else if (page === 'cart') renderCart();  
            else if (page === 'login') renderLogin();
            else if (page === 'eitaa-warning') renderEitaaWarning();
            else if (page === 'user-dashboard') renderUserDashboard();  
            else if (page === 'admin') renderAdminDashboard();  
            updateCartBadge(); applyLayoutMode(); updateHeaderLogoutButton(); saveState();  
        }  

        function updateCartBadge() {  
            const count = state.cart.reduce((s, i) => s + (i.quantity || 0), 0);  
            const badge = document.getElementById('bottomCartBadge');  
            if (badge) { badge.style.display = count > 0 ? 'flex' : 'none'; badge.textContent = count; }  
        }  

        function handleGlobalSearch(query) {  
            if (!query || query.length < 2) return;  
            showPage('shop'); renderShop(query.toLowerCase());  
        }  

        function toggleAdminSidebar() {  
            document.getElementById('adminSidebar').classList.toggle('open');  
            document.getElementById('adminBackdrop').classList.toggle('show');  
        }

        }

        function renderLogin() {

            let extraHTML = '';
            
            // همیشه دکمه دریافت/نمایش کد کاربری نمایش داده می‌شود
            if (eitaaUser) {
                if (hasCredentials) {
                    // اگر قبلاً کد و رمز دارد، همان قبلی را نمایش بده
                    extraHTML = `
                        <div style="margin-top:16px;padding-top:16px;border-top:1px dashed var(--border);">
                            <p style="font-size:0.8rem;color:var(--text-light);text-align:center;margin-bottom:10px;">🔑 کد کاربری و رمز عبور شما:</p>
                            <div class="credentials-box" style="margin:0;">
                                <h4 style="font-size:1rem;">اطلاعات ورود شما</h4>
                                <div style="margin-top:10px;">
                                    <div style="font-size:0.8rem;opacity:0.9;">کد کاربری:</div>
                                    <div style="font-size:1.1rem;font-weight:800;">${existingUser.userCode}</div>
                                </div>
                                <div style="margin-top:10px;">
                                    <div style="font-size:0.8rem;opacity:0.9;">رمز عبور:</div>
                                    <div style="font-size:1.1rem;font-weight:800;">${existingUser.password}</div>
                                </div>
                                <button class="btn btn-sm" style="background:rgba(255,255,255,0.3);color:#fff;width:100%;margin-top:12px;" onclick="copyBothCredentials('${existingUser.userCode}', '${existingUser.password}')"><i class="fa-regular fa-copy"></i> کپی اطلاعات</button>
                            </div>
                        </div>
                    `;
                } else {
                    // اگر ندارد، جدید تولید کن
                    extraHTML = `
                        <div style="margin-top:16px;padding-top:16px;border-top:1px dashed var(--border);">
                            <p style="font-size:0.8rem;color:var(--text-light);text-align:center;margin-bottom:10px;">🔑 هنوز کد کاربری ندارید؟</p>
                            <button class="generate-btn" onclick="generateCredentials(${userId})" id="generateBtn"><i class="fa-solid fa-key"></i> دریافت کد کاربری و رمز</button>
                            <p style="font-size:0.75rem;color:var(--text-light);text-align:center;margin-top:8px;">⚠️ فقط یک‌بار تولید می‌شود</p>
                        </div>
                    `;
                }
            }

            container.innerHTML = `
                <div class="login-box">
                    <h3><i class="fa-solid fa-lock"></i> ورود به حساب</h3>
                    <p style="font-size:0.85rem;color:var(--text-light);text-align:center;margin-bottom:16px;">${eitaaUser ? `👋 سلام ${eitaaUser.first_name || 'کاربر'} عزیز` : 'کد کاربری و رمز عبور خود را وارد کنید'}</p>
                    <form onsubmit="handleUnifiedLogin(event)">
                        <div style="margin-bottom:12px;"><label style="font-size:0.9rem;font-weight:700;">کد کاربری:</label><input type="text" id="loginUserCode" required placeholder="کد کاربری"></div>
                        <div style="margin-bottom:16px;"><label style="font-size:0.9rem;font-weight:700;">رمز عبور:</label><input type="password" id="loginPassword" required placeholder="رمز عبور"></div>
                        <button type="submit" class="btn btn-primary btn-block">ورود</button>
                    </form>
                    ${extraHTML}
                </div>
            `;
        }

        function handleUnifiedLogin(e) {
            e.preventDefault();
            const inputCode = document.getElementById('loginUserCode').value.trim();
            const inputPassword = document.getElementById('loginPassword').value;

            if (inputCode === ADMIN_USERNAME && inputPassword === ADMIN_PASSWORD) {
                let adminUser = state.users.find(u => u.role === 'admin');
                if (!adminUser) { adminUser = { id: 'admin_local', userId: eitaaUser ? eitaaUser.id : 0, name: 'مدیر', phone: '09120000000', role: 'admin', address: '', postalCode: '', city: '', firstPurchaseDone: true, createdAt: Date.now() }; state.users.push(adminUser); }
                state.currentUser = adminUser; saveState(); showToast('خوش آمدید', 'success'); showPage('admin'); return;
            }

            const user = state.users.find(u => u.userCode === inputCode && u.password === inputPassword && u.role !== 'admin');
            if (!user) { showToast('کد کاربری یا رمز عبور اشتباه است', 'error'); return; }
            if (eitaaUser && user.userId !== eitaaUser.id) { showToast('⚠️ این حساب متعلق به اکانت ایتای فعلی نیست!', 'error'); return; }

            state.currentUser = user; saveState(); showToast(`خوش آمدید ${user.name}`, 'success'); showPage('home');
        }

        function generateCredentials(userId) {
            const user = state.users.find(u => u.userId === userId);
            if (!user) { showToast('کاربر یافت نشد', 'error'); return; }
            
            // اگر قبلاً کد و رمز دارد، همان قبلی را نمایش بده
            if (user.userCode && user.password) {
                showCredentialsModal(user.userCode, user.password);
                return;
            }
            
            // اگر ندارد، جدید تولید کن
            const userCode = generateUserCode();
            const password = generatePassword();
            user.userCode = userCode; user.password = password;
            const idx = state.users.findIndex(u => u.id === user.id);
            if (idx !== -1) state.users[idx] = user;
            saveState();
            const btn = document.getElementById('generateBtn');
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-check"></i> اطلاعات تولید شد'; }
            showCredentialsModal(userCode, password);
        }

        function showCredentialsModal(userCode, password) {
            document.getElementById('modalContainer').innerHTML = `<div class="modal-overlay"><div class="modal"><button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button><div class="credentials-box"><h4>🔐 اطلاعات ورود شما</h4><p style="font-size:0.85rem;margin-bottom:16px;opacity:0.9;">⚠️ این اطلاعات را ذخیره کنید!</p><div class="credential-item"><button class="copy-btn" onclick="copyText('${userCode}')"><i class="fa-regular fa-copy"></i></button><div class="credential-label">کد کاربری:</div><div class="credential-value">${userCode}</div></div><div class="credential-item"><button class="copy-btn" onclick="copyText('${password}')"><i class="fa-regular fa-copy"></i></button><div class="credential-label">رمز عبور:</div><div class="credential-value">${password}</div></div><button class="btn btn-primary btn-block" onclick="copyBothCredentials('${userCode}', '${password}')" style="margin-top:16px;"><i class="fa-regular fa-copy"></i> کپی هر دو</button></div><button class="btn btn-secondary btn-block" onclick="closeModal()">متوجه شدم</button></div></div>`;
        }

        function copyText(text) { navigator.clipboard.writeText(text).then(() => showToast('کپی شد', 'success')); }
        function copyBothCredentials(userCode, password) { const text = `کد کاربری: ${userCode}\nرمز عبور: ${password}`; navigator.clipboard.writeText(text).then(() => showToast('هر دو کپی شدند', 'success')); }

        function applyDiscountCode(code) { const discount = state.discounts.find(d => d.code === code && d.active); if (!discount) { showToast('کد تخفیف نامعتبر است', 'error'); return false; } state.appliedDiscount = discount; showToast(`تخفیف ${discount.percent}٪ اعمال شد!`, 'success'); return true; }
        function removeDiscount() { state.appliedDiscount = null; showToast('تخفیف حذف شد', 'info'); if (state.activePage === 'cart') renderCart(); }
        function calculateDiscount() { 
            if (!state.appliedDiscount) return 0; 
            const discount = state.appliedDiscount; 
            let subtotal = state.cart.reduce((sum, item) => { 
                const p = getProductById(item.productId); 
                return sum + (p ? getEffectivePrice(p, item.weightId) * item.quantity : 0); 
            }, 0); 
            return Math.round((subtotal * discount.percent) / 100); 
        }

        function renderHome() {  
            const featuredContainer = document.getElementById('homeFeaturedProducts');
            if (featuredContainer) featuredContainer.innerHTML = state.products.map(p => createProductCardHTML(p)).join('');  
        }  

        function createProductCardHTML(product) {  
            if (!product) return '';
            const defaultWeightId = state.selectedWeight[product.id] || 'w1';
            const effPrice = getEffectivePrice(product, defaultWeightId);  
            const inCart = state.cart.find(item => item.productId === product.id && item.weightId === defaultWeightId);  
            const imageHtml = product.image ? `<img src="${product.image}">` : `<span style="font-size:2.5rem;">${product.icon}</span>`;
            
            const weightButtonsHTML = product.weights.map(w => {
                const isSelected = defaultWeightId === w.id;
                const isAvailable = w.stock !== 0;
                const discount = w.id === 'w1' ? (product.discount100 || 0) : (product.discount250 || 0);
                let badgeHTML = '';
                if (!isAvailable) {
                    badgeHTML = `<span class="out-of-stock">ناموجود</span>`;
                } else if (discount > 0) {
                    badgeHTML = `<span class="discount-badge-weight">${discount}٪</span>`;
                }
                return `<button class="${isSelected ? 'selected' : ''}" ${!isAvailable ? 'disabled' : ''} onclick="event.stopPropagation(); selectWeight('${product.id}', '${w.id}')">${w.label}${badgeHTML}</button>`;
            }).join('');
            
            const canAddToCart = isWeightAvailable(product, defaultWeightId);
            
            return `<div class="product-card" onclick="showProductDetail('${product.id}')"><div class="product-image" style="position:relative;">${imageHtml}</div><div class="product-body"><div class="product-name">${product.name}</div><div class="product-price">${formatPrice(effPrice)} <small>تومان</small>${(product.discount100 || 0) > 0 || (product.discount250 || 0) > 0 ? `<span class="original">${formatPrice(getWeightById(product, defaultWeightId).price)}</span>` : ''}</div><div class="weight-options">${weightButtonsHTML}</div><button class="add-to-cart-btn ${inCart ? 'added' : ''}" ${!canAddToCart ? 'disabled' : ''} onclick="event.stopPropagation(); addToCart('${product.id}', '${defaultWeightId}')"><i class="fa-solid ${inCart ? 'fa-check' : 'fa-cart-plus'}"></i> ${!canAddToCart ? 'ناموجود' : (inCart ? 'افزوده شد' : 'افزودن')}</button></div></div>`;  
        }  

        function selectWeight(productId, weightId) { 
            state.selectedWeight[productId] = weightId; 
            saveState(); 
            if (state.activePage === 'home') renderHome(); 
            else if (state.activePage === 'shop') renderShop(); 
        }  

        function showProductDetail(productId) {  
            const product = getProductById(productId); if (!product) return;  
            const modal = document.getElementById('modalContainer');  
            const selectedW = state.selectedWeight[product.id] || 'w1';
            const usesArray = product.uses ? product.uses.split('\n').filter(u => u.trim() !== '') : [];
            const relatedRecipes = (product.foods || []).map(foodId => getRecipeById(foodId)).filter(Boolean);
            
            const pricesHTML = product.weights.map(w => {
                const isAvailable = w.stock !== 0;
                const discount = w.id === 'w1' ? (product.discount100 || 0) : (product.discount250 || 0);
                let discountHTML = '';
                if (discount > 0) {
                    discountHTML = `<span style="background:var(--gold);color:#333;padding:2px 8px;border-radius:12px;font-size:0.75rem;font-weight:700;margin-right:8px;">${discount}٪ تخفیف</span><span style="text-decoration:line-through;color:var(--text-light);font-size:0.85rem;">${formatPrice(w.price)}</span>`;
                }
                const statusHTML = !isAvailable ? `<span style="background:#e74c3c;color:#fff;padding:2px 8px;border-radius:12px;font-size:0.75rem;font-weight:700;margin-right:8px;">ناموجود</span>` : '';
                return `<div style="background:var(--cream);padding:10px;border-radius:var(--radius-sm);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;${!isAvailable ? 'opacity:0.6;' : ''}"><span style="font-weight:700;">${w.label}</span><div>${statusHTML}${discountHTML}<span style="font-weight:800;color:var(--accent);margin-right:8px;">${formatPrice(getEffectivePrice(product, w.id))} تومان</span></div></div>`;
            }).join('');
            
            const recipesHTML = relatedRecipes.length > 0 ? `<div class="detail-section"><h4><i class="fa-solid fa-utensils"></i> غذاهایی که با این ادویه می‌توانید بپزید</h4><div class="spice-uses-grid">${relatedRecipes.map(r => `<div class="spice-use-card" onclick="closeModal(); setTimeout(()=>showRecipeDetail('${r.id}'), 100);"><i class="fa-solid fa-bowl-food"></i><h5>${r.title}</h5><p>${r.cookTime} | ${r.servings}</p></div>`).join('')}</div></div>` : '';
            
            const selectedWeight = getWeightById(product, selectedW);
            const canAdd = selectedWeight && selectedWeight.stock !== 0;
            
            modal.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button><div class="detail-hero">${product.image ? `<img src="${product.image}">` : `<span>${product.icon}</span>`}</div><h3>${product.name}</h3><div class="detail-section"><h4><i class="fa-solid fa-circle-info"></i> توضیحات</h4><p>${product.fullDescription}</p></div>${usesArray.length > 0 ? `<div class="detail-section"><h4><i class="fa-solid fa-heart-pulse"></i> کاربردها</h4><ul class="uses-list">${usesArray.map(u => `<li><i class="fa-solid fa-check"></i> ${u}</li>`).join('')}</ul></div>` : ''}<div class="detail-section"><h4><i class="fa-solid fa-tag"></i> قیمت‌ها</h4>${pricesHTML}</div>${recipesHTML}<div class="detail-section" style="background:var(--cream); padding:16px; border-radius:var(--radius-sm); text-align:center;"><div style="font-size:1.3rem;font-weight:800;color:var(--accent);margin-bottom:12px;">${formatPrice(getEffectivePrice(product, selectedW))} تومان <small style="font-size:0.85rem;color:var(--text-light)">(${selectedWeight.label})</small></div><button class="btn btn-primary btn-block" ${!canAdd ? 'disabled' : ''} onclick="addToCart('${product.id}', '${selectedW}'); closeModal();"><i class="fa-solid fa-cart-plus"></i> ${!canAdd ? 'ناموجود' : 'افزودن به سبد'}</button></div></div></div>`;  
        }

        function closeModal() { const modal = document.getElementById('modalContainer'); if (modal) modal.innerHTML = ''; }  

        function renderShop(searchQuery = '') {  
            let filtered = state.products;
            if (searchQuery) filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery) || p.fullDescription.toLowerCase().includes(searchQuery));  
            const productsContainer = document.getElementById('shopProducts');
            if (productsContainer) productsContainer.innerHTML = filtered.length > 0 ? filtered.map(p => createProductCardHTML(p)).join('') : '<div class="empty-state"><i class="fa-solid fa-search"></i><p>محصولی یافت نشد</p></div>';  
        }  

        function addToCart(productId, weightId) {  
            const product = getProductById(productId); if (!product) return;  
            if (!isWeightAvailable(product, weightId)) {
                showToast('این وزن ناموجود است', 'error');
                return;
            }
            const existing = state.cart.find(item => item.productId === productId && item.weightId === weightId);  
            if (existing) existing.quantity += 1; else state.cart.push({ productId, weightId, quantity: 1 });  
            saveState(); updateCartBadge(); showToast(`${product.name} اضافه شد`, 'success');  
            if (state.activePage === 'shop') renderShop(); else if (state.activePage === 'home') renderHome(); else if (state.activePage === 'cart') renderCart();  
        }  

        function removeFromCart(productId, weightId) { state.cart = state.cart.filter(i => !(i.productId === productId && i.weightId === weightId)); saveState(); updateCartBadge(); renderCart(); }  
        function changeCartQty(productId, weightId, delta) { 
            const item = state.cart.find(i => i.productId === productId && i.weightId === weightId); 
            if (item) { 
                item.quantity += delta; 
                if (item.quantity <= 0) removeFromCart(productId, weightId); 
                else { saveState(); updateCartBadge(); renderCart(); } 
            } 
        }

            const container = document.getElementById('kitchenContent');
            if (!container) return;

                { id: 'iranian', name: 'غذاهای ایرانی', icon: '🇮🇷', color: '#2980b9' },
                { id: 'international', name: 'بین‌المللی', icon: '🌍', color: '#8e44ad' },
                { id: 'appetizer', name: 'پیش‌غذا', icon: '🥗', color: '#27ae60' },
                { id: 'soup', name: 'سوپ و آش', icon: '🥣', color: '#e67e22' },
                { id: 'kebab', name: 'کباب', icon: '🍗', color: '#8B4513' },
                { id: 'pasta', name: 'پاستا', icon: '🍝', color: '#ff5722' },
                { id: 'dessert', name: 'دسر', icon: '🍰', color: '#e91e63' },
                { id: 'drink', name: 'نوشیدنی', icon: '🍵', color: '#9b59b6' },
                { id: 'breakfast', name: 'صبحانه', icon: '🍳', color: '#ff9800' },
                { id: 'salad', name: 'سالاد', icon: '🥬', color: '#4caf50' },

                <div class="section-header"><h3>️ قفسه‌ها</h3></div>

            }, 100);
        }

                { id: 'iranian', name: 'غذاهای ایرانی', icon: '🇮🇷' },

                { id: 'appetizer', name: 'پیش‌غذا', icon: '🥗' },
                { id: 'soup', name: 'سوپ و آش', icon: '🥣' },
                { id: 'kebab', name: 'کباب', icon: '🍗' },
                { id: 'pasta', name: 'پاستا', icon: '🍝' },
                { id: 'dessert', name: 'دسر', icon: '🍰' },
                { id: 'drink', name: 'نوشیدنی', icon: '🍵' },
                { id: 'breakfast', name: 'صبحانه', icon: '🍳' },
                { id: 'salad', name: 'سالاد', icon: '🥬' },

        }

        function showRecipeDetail(recipeId) {
            const recipe = getRecipeById(recipeId);
            if (!recipe) return;
            const spices = recipe.spices.map(spiceId => { 
                const product = getProductById(spiceId); 
                return product ? { id: spiceId, name: product.name, icon: product.icon, price: getEffectivePrice(product, 'w1'), weightId: 'w1' } : null; 
            }).filter(Boolean);

            document.getElementById('modalContainer').innerHTML = `
                <div class="modal-overlay" onclick="if(event.target===this)closeModal()">

                        <div class="detail-hero">${recipe.image ? `<img src="${recipe.image}">` : `<span style="font-size:5rem;">${recipe.icon}</span>`}</div>

                            <div style="text-align:center;"><i class="fa-regular fa-clock" style="font-size:1.5rem;color:var(--accent);"></i><div style="font-size:0.85rem;margin-top:4px;">${recipe.cookTime}</div></div>
                            <div style="text-align:center;"><i class="fa-solid fa-users" style="font-size:1.5rem;color:var(--accent);"></i><div style="font-size:0.85rem;margin-top:4px;">${recipe.servings}</div></div>
                            <div style="text-align:center;"><i class="fa-solid fa-signal" style="font-size:1.5rem;color:var(--accent);"></i><div style="font-size:0.85rem;margin-top:4px;">${recipe.difficulty}</div></div>

        function addRecipeSpicesToCart(recipeId) {
            const recipe = getRecipeById(recipeId); if (!recipe) return;
            recipe.spices.forEach(spiceId => {
                const product = getProductById(spiceId);
                if (product && isWeightAvailable(product, 'w1')) {
                    const existing = state.cart.find(item => item.productId === spiceId && item.weightId === 'w1');
                    if (existing) existing.quantity += 1; else state.cart.push({ productId: spiceId, weightId: 'w1', quantity: 1 });
                }
            });
            saveState(); updateCartBadge(); showToast('همه ادویه‌ها به سبد اضافه شدند ', 'success'); closeModal();
        }

        function renderCart() {  
            const container = document.getElementById('cartContent');  
            if (!container) return;
            if (state.cart.length === 0) { container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-shopping-cart"></i><p>سبد خالی است</p><button class="btn btn-primary btn-sm" onclick="showPage('shop')">رفتن به فروشگاه</button></div>`; return; }  
            let subtotal = state.cart.reduce((sum, item) => { const p = getProductById(item.productId); return sum + (p ? getEffectivePrice(p, item.weightId) * item.quantity : 0); }, 0);
            const discountAmount = calculateDiscount();
            const shipping = state.settings.shippingCost || 0;
            const vat = Math.round(((subtotal - discountAmount) * (state.settings.vatPercent || 0)) / 100);
            const total = subtotal - discountAmount + shipping + vat;
            const itemsHTML = state.cart.map(item => {  
                const product = getProductById(item.productId); if (!product) return '';  
                const weight = getWeightById(product, item.weightId);
                const price = getEffectivePrice(product, item.weightId); 
                const subtotalItem = price * item.quantity;  
                return `<div style="background:#fff;border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:10px;"><div style="font-size:1.8rem;">${product.icon}</div><div style="flex:1;"><div style="font-weight:700;">${product.name}</div><div style="font-size:0.8rem;color:var(--text-light);">${weight ? weight.label : ''}</div><div style="font-weight:700;color:var(--accent);">${formatPrice(subtotalItem)} تومان</div></div><div style="display:flex;gap:4px;"><button onclick="changeCartQty('${product.id}', '${item.weightId}', -1)" style="background:var(--cream);width:28px;height:28px;border-radius:50%;">−</button><span style="font-weight:700;">${item.quantity}</span><button onclick="changeCartQty('${product.id}', '${item.weightId}', 1)" style="background:var(--cream);width:28px;height:28px;border-radius:50%;">+</button></div><button class="btn btn-danger btn-sm" onclick="removeFromCart('${product.id}', '${item.weightId}')"><i class="fa-solid fa-trash"></i></button></div>`;  
            }).join('');  
            container.innerHTML = `${itemsHTML}<div class="checkout-summary"><div class="checkout-row"><span>جمع:</span><span>${formatPrice(subtotal)} تومان</span></div>${discountAmount > 0 ? `<div class="checkout-row" style="color:var(--green);"><span>تخفیف:</span><span>-${formatPrice(discountAmount)} تومان</span></div>` : ''}<div class="checkout-row"><span>ارسال:</span><span>${formatPrice(shipping)} تومان</span></div><div class="checkout-row"><span>مالیات:</span><span>${formatPrice(vat)} تومان</span></div><div class="checkout-row total"><span>مبلغ قابل پرداخت:</span><span>${formatPrice(total)} تومان</span></div></div><div style="background:#fff;border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:12px;"><label style="font-size:0.9rem;font-weight:700;display:block;margin-bottom:8px;">کد تخفیف:</label><div style="display:flex;gap:8px;"><input type="text" id="discountCodeInput" placeholder="کد تخفیف"><button class="btn btn-primary btn-sm" onclick="applyDiscountFromInput()">اعمال</button></div>${state.appliedDiscount ? `<div style="background:var(--green);color:#fff;padding:8px 12px;border-radius:var(--radius-sm);font-size:0.85rem;margin-top:8px;"><i class="fa-solid fa-check"></i> تخفیف ${state.appliedDiscount.percent}٪ اعمال شد <button onclick="removeDiscount()" style="background:none;color:#fff;border:none;float:left;cursor:pointer;"><i class="fa-solid fa-xmark"></i></button></div>` : ''}</div><div style="background:#fff;border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow-sm);"><button class="btn btn-primary btn-block" onclick="showCheckoutModal()">تسویه حساب</button></div>`;  
        }  

        function applyDiscountFromInput() { const code = document.getElementById('discountCodeInput').value.trim(); if (applyDiscountCode(code)) renderCart(); }

                showPage('login');

                showToast('لطفاً ابتدا کد کاربری و رمز عبور دریافت کنید', 'error');

            if (!state.currentUser.name || !state.currentUser.phone || !state.currentUser.address || !state.currentUser.city) {
                showInitialRegistrationModal();

            }
            
            let subtotal = state.cart.reduce((sum, item) => { const p = getProductById(item.productId); return sum + (p ? getEffectivePrice(p, item.weightId) * item.quantity : 0); }, 0);

            document.getElementById('modalContainer').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:550px;"><button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button><h3 style="margin-bottom:16px;"> تسویه حساب</h3><div style="background:var(--cream);padding:12px;border-radius:var(--radius-sm);margin-bottom:16px;font-size:0.9rem;"><strong>نام:</strong> ${state.currentUser.name}<br><strong>تلفن:</strong> ${state.currentUser.phone}<br><strong>آدرس:</strong> ${state.currentUser.address}، ${state.currentUser.city}</div><div class="checkout-summary"><div class="checkout-row"><span>جمع:</span><span>${formatPrice(subtotal)} تومان</span></div>${discountAmount > 0 ? `<div class="checkout-row" style="color:var(--green);"><span>تخفیف:</span><span>-${formatPrice(discountAmount)} تومان</span></div>` : ''}<div class="checkout-row"><span>ارسال:</span><span>${formatPrice(shipping)} تومان</span></div><div class="checkout-row"><span>مالیات:</span><span>${formatPrice(vat)} تومان</span></div><div class="checkout-row total"><span>مبلغ قابل پرداخت:</span><span>${formatPrice(total)} تومان</span></div></div><div style="margin-bottom:16px;"><div style="background:var(--cream);padding:12px;border-radius:var(--radius-sm);"><div style="font-weight:700;margin-bottom:8px;">💳 شماره کارت فروشگاه:</div><div style="font-family:monospace;font-size:1.1rem;direction:ltr;text-align:center;">${state.settings.storeCardNumber}</div><div style="text-align:center;margin-top:8px;">${state.settings.storeCardName}</div><button class="btn btn-secondary btn-sm btn-block" style="margin-top:8px;" onclick="copyToClipboard('${state.settings.storeCardNumber}')"><i class="fa-regular fa-copy"></i> کپی شماره کارت</button></div></div><div style="margin-bottom:16px;"><label style="font-size:0.85rem;font-weight:700;">شماره کارت شما (پرداخت کننده):</label><input type="text" id="userCardNumber" placeholder="16 رقم" maxlength="19" style="margin-top:6px; direction:ltr; text-align:left;" oninput="formatCardInput(this)"></div><div style="margin-bottom:16px;"><label style="font-size:0.85rem;font-weight:700;">ارسال فیش واریزی:</label><select id="receiptType" onchange="toggleReceiptType()" style="margin-top:6px;margin-bottom:8px;"><option value="text">توضیحات متنی (شماره پیگیری)</option><option value="image">آپلود تصویر فیش</option></select><textarea id="receiptText" placeholder="شماره پیگیری تراکنش..." style="margin-bottom:12px;"></textarea><input type="file" id="receiptImage" accept="image/*" style="display:none;margin-bottom:12px;"></div><button class="btn btn-primary btn-block" onclick="processOrder(${subtotal}, ${discountAmount}, ${shipping}, ${vat}, ${total})"><i class="fa-solid fa-check-circle"></i> ثبت سفارش نهایی</button></div></div>`;
        }

        function showInitialRegistrationModal() {
            const u = state.currentUser;
            document.getElementById('modalContainer').innerHTML = `
                <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                    <div class="modal">
                        <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                        <h3 style="margin-bottom:16px;color:var(--accent);"><i class="fa-solid fa-user-plus"></i> تکمیل اطلاعات ثبت‌نام</h3>
                        <p style="font-size:0.85rem;color:var(--text-light);margin-bottom:16px;">لطفاً اطلاعات زیر را تکمیل کنید تا بتوانید سفارش ثبت کنید.</p>
                        <form onsubmit="saveInitialRegistration(event)">
                            <div style="margin-bottom:10px;"><label style="font-size:0.9rem;font-weight:700;">نام و نام خانوادگی *</label><input type="text" id="regName" value="${u.name || ''}" required></div>
                            <div style="margin-bottom:10px;"><label style="font-size:0.9rem;font-weight:700;">شماره موبایل *</label><input type="tel" id="regPhone" value="${u.phone || ''}" required pattern="09[0-9]{9}" placeholder="09123456789"></div>
                            <div style="margin-bottom:10px;"><label style="font-size:0.9rem;font-weight:700;">شهر *</label><input type="text" id="regCity" value="${u.city || ''}" required></div>
                            <div style="margin-bottom:10px;"><label style="font-size:0.9rem;font-weight:700;">آدرس کامل *</label><textarea id="regAddress" rows="3" required>${u.address || ''}</textarea></div>
                            <div style="margin-bottom:10px;"><label style="font-size:0.9rem;font-weight:700;">کد پستی *</label><input type="text" id="regPostal" value="${u.postalCode || ''}" required pattern="[0-9]{10}" maxlength="10" placeholder="10 رقم"></div>
                            <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-check"></i> ذخیره و ادامه تسویه</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function saveInitialRegistration(e) {
            e.preventDefault();
            const u = state.currentUser;
            u.name = document.getElementById('regName').value.trim();
            u.phone = document.getElementById('regPhone').value.trim();
            u.city = document.getElementById('regCity').value.trim();
            u.address = document.getElementById('regAddress').value.trim();
            u.postalCode = document.getElementById('regPostal').value.trim();
            const idx = state.users.findIndex(x => x.id === u.id);
            if (idx !== -1) state.users[idx] = { ...u };
            saveState();
            showToast('اطلاعات ذخیره شد', 'success');
            closeModal();
            setTimeout(() => showCheckoutModal(), 300);
        }

        function formatCardInput(input) {
            let val = input.value.replace(/\D/g, '').substring(0, 16);
            val = val.replace(/(\d{4})/g, '$1 ').trim();
            input.value = val;
        }

        function toggleReceiptType() { const type = document.getElementById('receiptType').value; document.getElementById('receiptText').style.display = type === 'text' ? 'block' : 'none'; document.getElementById('receiptImage').style.display = type === 'image' ? 'block' : 'none'; }
        function copyToClipboard(text) { if (!text) return; navigator.clipboard.writeText(text).then(() => showToast('کپی شد', 'success')); }

        async function sendOrderToEitaa(order) {
            const channelId = state.settings.adminChatId || EITAA_CHANNEL_ID;
            
            const itemsText = order.items.map(item => {
                const p = getProductById(item.productId);
                const w = p ? getWeightById(p, item.weightId) : null;
                return `• ${p ? p.name : 'محصول'} (${w ? w.label : ''}) - ${item.quantity} عدد - ${formatPrice(getEffectivePrice(p, item.weightId) * item.quantity)} تومان`;
            }).join('\n');

            const message = `
🛒 <b>سفارش جدید!</b>

👤 <b>نام:</b> ${order.userName}
📞 <b>تلفن:</b> ${order.userPhone}
📍 <b>آدرس:</b> ${order.userAddress}
📮 <b>کد پستی:</b> ${order.userPostalCode || 'ندارد'}
🔑 <b>کد کاربری:</b> ${order.userCode || 'ندارد'}

🛍️ <b>اقلام:</b>
${itemsText}

💰 <b>جمع:</b> ${formatPrice(order.subtotal)} تومان
${order.discount > 0 ? `🎁 <b>تخفیف:</b> ${formatPrice(order.discount)} تومان\n` : ''}📦 <b>ارسال:</b> ${formatPrice(order.shipping)} تومان
 <b>مالیات:</b> ${formatPrice(order.vat)} تومان
💳 <b>کل:</b> ${formatPrice(order.total)} تومان

💳 <b>روش پرداخت:</b> کارت به کارت
🏦 <b>شماره کارت پرداخت کننده:</b> <code>${order.payerCardNumber || 'ندارد'}</code>
📝 <b>فیش واریزی:</b> ${order.receiptInfo}

⏰ <b>زمان:</b> ${new Date(order.createdAt).toLocaleString('fa-IR')}
            `.trim();

            try {
                const response = await fetch(`${EITAA_API_URL}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: channelId,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
                const data = await response.json();
                if (data.ok) {
                    return true;
                } else {
                    console.error('Eitaa API error:', data);
                    return false;
                }
            } catch(e) {
                console.error('Fetch error:', e);
                return false;
            }
        }

        async function processOrder(subtotal, discountAmount, shipping, vat, total) {
            const userCard = document.getElementById('userCardNumber').value.replace(/\s/g, '');
            if (userCard.length < 16) { showToast('شماره کارت پرداخت کننده را وارد کنید', 'error'); return; }
            
            const rType = document.getElementById('receiptType').value;
            let receiptInfo = '';
            let receiptImageBase64 = null;
            
            if (rType === 'text') { 
                receiptInfo = document.getElementById('receiptText').value; 
                if (!receiptInfo) { showToast('شماره پیگیری را وارد کنید', 'error'); return; } 
            } else { 
                const file = document.getElementById('receiptImage').files[0]; 
                if (!file) { showToast('تصویر فیش را انتخاب کنید', 'error'); return; } 
                receiptInfo = 'تصویر فیش آپلود شد';
                receiptImageBase64 = await fileToBase64(file);
            }
            receiptInfo = `${receiptInfo}`;

            const order = { 
                id: generateId(), 
                userId: state.currentUser.id, 
                userCode: state.currentUser.userCode || '',
                userName: state.currentUser.name, 
                userPhone: state.currentUser.phone, 
                userAddress: state.currentUser.address + '، ' + state.currentUser.city, 
                userPostalCode: state.currentUser.postalCode, 
                items: JSON.parse(JSON.stringify(state.cart)), 
                subtotal: subtotal, 
                discount: discountAmount, 
                discountCode: state.appliedDiscount ? state.appliedDiscount.code : '', 
                shipping: shipping, 
                vat: vat, 
                total: total, 
                payerCardNumber: userCard,
                receiptInfo: receiptInfo,
                receiptImage: receiptImageBase64,
                status: 'pending_payment', 
                trackingCode: '', 
                createdAt: Date.now() 
            };
            
            state.orders.push(order); 
            state.cart = []; 
            state.appliedDiscount = null; 
            saveState(); 
            updateCartBadge(); 
            closeModal();
            
            const sent = await sendOrderToEitaa(order);
            
            if (sent) {
                showToast('سفارش ثبت و به کانال ارسال شد 🎉', 'success');
            } else {
                showToast('سفارش ثبت شد (ارسال به کانال ناموفق بود)', 'info');
            }
            showPage('user-dashboard');
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function downloadBackup() {
            const backupData = {
                version: 'tamYar_v12',
                backupDate: new Date().toISOString(),
                users: state.users,
                orders: state.orders,
                messages: state.messages,
                products: state.products,
                recipes: state.recipes,
                discounts: state.discounts,
                settings: state.settings
            };
            const dataStr = JSON.stringify(backupData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `tamYar_backup_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast('بک‌آپ با موفقیت دانلود شد', 'success');
        }

        function restoreBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const backupData = JSON.parse(e.target.result);
                    
                    if (!backupData.users || !Array.isArray(backupData.users)) {
                        showToast('فایل بک‌آپ نامعتبر است', 'error');
                        return;
                    }
                    
                    if (confirm('آیا مطمئن هستید که می‌خواهید تمام اطلاعات فعلی را با بک‌آپ جایگزین کنید؟')) {
                        state.users = backupData.users;
                        state.orders = backupData.orders || [];
                        state.messages = backupData.messages || [];
                        state.products = backupData.products || DEFAULT_PRODUCTS;
                        state.recipes = backupData.recipes || ALL_RECIPES;
                        state.discounts = backupData.discounts || [];
                        if (backupData.settings) {
                            state.settings = { ...state.settings, ...backupData.settings };
                        }
                        saveState();
                        showToast('بک‌آپ با موفقیت بازیابی شد. کاربران می‌توانند با کد کاربری و رمز قبلی وارد شوند.', 'success');
                        showAdminTab('overview');
                    }
                } catch(err) {
                    console.error('Restore error:', err);
                    showToast('خطا در بازیابی بک‌آپ', 'error');
                }
            };
            reader.readAsText(file);
        }

                    }

                    saveState(); 
                    showPage('admin');

                    user = { 
                        id: `user_${userId}`,
