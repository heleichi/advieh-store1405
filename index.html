<!DOCTYPE html>
<html lang="fa" dir="rtl">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>🌶️ طعم‌یار | فروشگاه ادویه</title>  
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">  
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>  
        :root {  
            --bg: #f7f5f2; --text: #1a1815; --text-light: #6b6560;  
            --accent: #c0392b; --accent-hover: #a93226; --secondary: #8B4513;  
            --gold: #D4A017; --green: #27ae60; --cream: #f5ede3; --border: #e8ddd0;  
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04); --shadow-md: 0 4px 16px rgba(0,0,0,0.08);  
            --radius: 14px; --radius-sm: 10px; --radius-lg: 22px;  
            --font: 'Vazirmatn', sans-serif; --bottom-nav-height: 64px;  
        }  
        * { margin: 0; padding: 0; box-sizing: border-box; }  
        body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.7; min-height: 100vh; overflow-x: hidden; padding-bottom: var(--bottom-nav-height); }  
        body.admin-mode { padding-bottom: 0; background: #f0f0f0; }
        body.admin-mode .top-header, body.admin-mode .bottom-nav { display: none; }
        a { text-decoration: none; color: inherit; }  
        button { cursor: pointer; font-family: var(--font); border: none; outline: none; transition: 0.2s; background: none; }  
        input, select, textarea { font-family: var(--font); outline: none; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 0.95rem; transition: 0.2s; background: #fff; width: 100%; }  
        input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(192,57,43,0.08); }  
        .container { max-width: 600px; margin: 0 auto; padding: 0 12px; }  
        body.admin-mode .container { max-width: 100%; padding: 0 16px; }
        .page-section { display: none; animation: fadeIn 0.3s ease-in-out; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .top-header { background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; padding: 8px 12px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow-sm); height: 60px; }  
        .top-header .logo { font-size: 1.4rem; font-weight: 900; color: var(--accent); display: flex; align-items: center; gap: 6px; }  
        .top-header .search-box { flex: 1; background: var(--cream); border-radius: 50px; padding: 6px 12px; display: flex; align-items: center; gap: 8px; }  
        .top-header .search-box input { border: none; background: transparent; padding: 4px 0; font-size: 0.9rem; width: 100%; }  
        .header-logout-btn { background: var(--accent); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; display: none; align-items: center; gap: 4px; }
        .header-logout-btn.visible { display: flex; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; height: var(--bottom-nav-height); z-index: 1000; box-shadow: 0 -2px 12px rgba(0,0,0,0.06); }  
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.7rem; color: var(--text-light); padding: 4px 8px; border-radius: 12px; min-width: 56px; cursor: pointer; position: relative; }  
        .bottom-nav-item i { font-size: 1.3rem; }  
        .bottom-nav-item.active { color: var(--accent); background: rgba(192,57,43,0.06); }  
        .bottom-nav-item .badge { position: absolute; top: 2px; right: 12px; background: var(--accent); color: #fff; font-size: 0.65rem; width: 16px; height: 16px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: 700; }  
        .admin-top-bar { display: none; background: linear-gradient(135deg, #1f140e 0%, #3a2417 100%); color: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 1000; align-items: center; gap: 12px; }
        body.admin-mode .admin-top-bar { display: flex; }
        .admin-top-bar .admin-logo { font-size: 1.1rem; font-weight: 800; color: var(--gold); flex: 1; }
        .admin-top-bar-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 12px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
        .admin-sidebar { position: fixed; top: 0; right: -300px; width: 300px; height: 100%; background: #1f140e; color: #fff; z-index: 2000; transition: right 0.3s; padding: 16px; overflow-y: auto; }  
        .admin-sidebar.open { right: 0; }  
        .admin-sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }  
        .admin-sidebar-header h3 { color: var(--gold); font-size: 1.1rem; }
        .admin-sidebar .close-btn { color: #aaa; font-size: 1.4rem; cursor: pointer; }
        .admin-sidebar a { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--radius-sm); color: #ddd; margin-bottom: 4px; cursor: pointer; }  
        .admin-sidebar a:hover { background: rgba(255,255,255,0.1); color: #fff; }  
        .admin-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1500; display: none; }  
        .admin-backdrop.show { display: block; }  
        .home-hero-banner { background: linear-gradient(135deg, #3a2417, #6b3a1f); border-radius: var(--radius-lg); padding: 20px 16px; margin: 16px 0; color: #fff; text-align: center; }  
        .section-header { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 12px; }  
        .section-header h3 { font-size: 1.1rem; font-weight: 800; }  
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }  
        .product-card { background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border); cursor: pointer; }  
        .product-image { height: 130px; background: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; position: relative; overflow: hidden; }  
        .product-image img { width: 100%; height: 100%; object-fit: cover; }
        .product-body { padding: 10px 12px; }  
        .product-name { font-weight: 700; font-size: 0.9rem; }  
        .product-price { font-weight: 800; color: var(--accent); font-size: 0.95rem; }  
        .product-price .original { text-decoration: line-through; color: var(--text-light); font-size: 0.8rem; margin-left: 4px; }  
        .weight-options { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
        .weight-options button { background: var(--cream); border-radius: 20px; padding: 4px 10px; font-size: 0.72rem; font-weight: 600; border: 1px solid transparent; position: relative; }
        .weight-options button.selected { background: var(--accent); color: #fff; }
        .weight-options button:disabled { background: #f0f0f0; color: #999; cursor: not-allowed; opacity: 0.6; }
        .weight-options button .discount-badge-weight { position: absolute; top: -6px; right: -6px; background: var(--gold); color: #333; font-size: 0.6rem; padding: 1px 4px; border-radius: 8px; font-weight: 700; }
        .add-to-cart-btn { background: var(--accent); color: #fff; padding: 8px 12px; border-radius: 30px; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 8px; width: 100%; }  
        .add-to-cart-btn.added { background: var(--green); }  
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 16px; }  
        .modal { background: #fff; border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative; }  
        .modal-close { position: absolute; top: 16px; left: 16px; font-size: 1.3rem; color: var(--text-light); cursor: pointer; }  
        .toast-container { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 4000; display: flex; flex-direction: column; gap: 8px; }  
        .toast { padding: 10px 20px; border-radius: 30px; background: #333; color: #fff; font-size: 0.85rem; }  
        .toast.success { background: var(--green); } .toast.error { background: #e74c3c; }
        .btn { padding: 10px 18px; border-radius: 30px; font-weight: 700; font-size: 0.9rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }  
        .btn-primary { background: var(--accent); color: #fff; }  
        .btn-secondary { background: var(--cream); color: var(--text); } .btn-danger { background: #e74c3c; color: #fff; }  
        .btn-sm { padding: 6px 12px; font-size: 0.75rem; border-radius: 20px; } .btn-block { width: 100%; }  
        .login-box { background: #fff; border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-md); margin: 20px auto; max-width: 420px; }
        .login-box h3 { text-align: center; margin-bottom: 16px; color: var(--accent); }
        .credentials-display { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); border-radius: var(--radius-lg); padding: 20px; margin: 16px 0; color: #fff; }
        .credentials-display h4 { margin-bottom: 12px; }
        .cred-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.2); padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 8px; }
        .cred-row .label { font-size: 0.85rem; opacity: 0.9; }
        .cred-row .value { font-size: 1.1rem; font-weight: 800; font-family: monospace; }
        .cred-copy { background: rgba(255,255,255,0.3); border: none; color: #fff; padding: 6px 10px; border-radius: 12px; cursor: pointer; }
        .empty-state { text-align: center; padding: 30px 16px; color: var(--text-light); }
        .empty-state i { font-size: 2.5rem; margin-bottom: 8px; display: block; }
        .stock-manager { background: var(--cream); padding: 12px; border-radius: var(--radius-sm); margin-top: 12px; }
        .product-image-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: var(--radius-sm); margin-top: 8px; }
        .image-upload-area { border: 2px dashed var(--border); border-radius: var(--radius-sm); padding: 20px; text-align: center; cursor: pointer; margin-top: 8px; }
        .image-upload-area:hover { border-color: var(--accent); }
        .admin-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .admin-stat-card { background: #fff; border-radius: var(--radius-sm); padding: 14px; text-align: center; box-shadow: var(--shadow-sm); }
        .admin-stat-card .stat-icon { font-size: 1.5rem; margin-bottom: 6px; }
        .admin-stat-card .stat-value { font-size: 1.5rem; font-weight: 800; color: var(--accent); }
        .admin-stat-card .stat-label { font-size: 0.75rem; color: var(--text-light); }
        .order-card { background: #fff; border-radius: var(--radius-sm); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow-sm); }
        .order-card .order-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .order-card .order-info { background: var(--cream); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 10px; font-size: 0.9rem; }
        .order-card .order-info div { margin-bottom: 6px; }
        .order-card .order-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .order-card .order-actions select, .order-card .order-actions input { flex: 1; min-width: 120px; padding: 6px; font-size: 0.85rem; }
        .status-pending { color: #e67e22; font-weight: 700; }
        .status-approved { color: var(--green); font-weight: 700; }
        .status-rejected { color: #e74c3c; font-weight: 700; }
        .status-shipped { color: #3498db; font-weight: 700; }
        .status-delivered { color: var(--green); font-weight: 700; }
        .receipt-image { max-width: 100%; max-height: 200px; border-radius: var(--radius-sm); margin-top: 8px; cursor: pointer; }
        .admin-note-box { background: #fff3cd; border: 1px solid #ffc107; border-radius: var(--radius-sm); padding: 10px; margin-top: 10px; }
        .admin-note-box textarea { width: 100%; border: 1px solid #ddd; border-radius: 6px; padding: 8px; font-family: var(--font); }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .loading-spinner { border: 4px solid var(--cream); border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .kitchen-hero { background: linear-gradient(135deg, #e67e22 0%, #d35400 100%); border-radius: var(--radius-lg); padding: 28px 20px; margin: 18px 0; color: #fff; text-align: center; }
        .kitchen-shelves { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .kitchen-shelf { background: linear-gradient(135deg, #fff 0%, var(--cream) 100%); border-radius: var(--radius); padding: 18px 12px; text-align: center; cursor: pointer; border: 2px solid var(--border); }
        .kitchen-shelf.active { border-color: var(--accent); }
        .kitchen-shelf .shelf-icon { font-size: 2.5rem; }
        .kitchen-shelf .shelf-name { font-weight: 800; font-size: 0.95rem; }
        .kitchen-shelf .shelf-count { font-size: 0.75rem; color: var(--text-light); }
        .recipe-card { background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 14px; cursor: pointer; }
        .recipe-image { height: 160px; background: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 4rem; position: relative; overflow: hidden; }
        .recipe-image img { width: 100%; height: 100%; object-fit: cover; }
        .recipe-category-badge { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.95); padding: 4px 10px; border-radius: 15px; font-size: 0.75rem; font-weight: 700; }
        .recipe-body { padding: 14px; }
        .recipe-title { font-weight: 800; font-size: 1.05rem; margin-bottom: 6px; }
        .recipe-desc { font-size: 0.88rem; color: var(--text-light); margin-bottom: 10px; line-height: 1.6; }
        .recipe-spices { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
        .spice-tag { background: var(--cream); color: var(--secondary); padding: 5px 10px; border-radius: 18px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
        .spice-tag:hover { background: var(--accent); color: #fff; }
        .recipe-meta { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--text-light); }
        .recipe-detail-section { margin-bottom: 18px; }
        .recipe-detail-section h4 { color: var(--secondary); font-size: 1.05rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .recipe-detail-section ul { list-style: none; }
        .recipe-detail-section ul li { padding: 7px 0; border-bottom: 1px dashed var(--border); display: flex; align-items: center; gap: 10px; }
        .recipe-detail-section ul li i { color: var(--green); }
        .recipe-detail-section ol { padding-right: 20px; }
        .recipe-detail-section ol li { padding: 9px 0; border-bottom: 1px dashed var(--border); line-height: 1.8; }
        .spice-uses-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .spice-use-card { background: var(--cream); padding: 12px; border-radius: var(--radius-sm); text-align: center; cursor: pointer; border: 2px solid transparent; }
        .spice-use-card:hover { border-color: var(--accent); }
        .spice-use-card i { font-size: 1.8rem; color: var(--accent); margin-bottom: 6px; }
        .spice-use-card h5 { font-size: 0.9rem; font-weight: 700; margin-bottom: 3px; }
        .recipe-spice-item { background: var(--cream); padding: 12px; border-radius: var(--radius-sm); display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .recipe-spice-item .spice-info { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; }
        .detail-hero { width: 100%; height: 200px; background: var(--cream); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 4rem; margin-bottom: 16px; overflow: hidden; }
        .detail-hero img { width: 100%; height: 100%; object-fit: cover; }
        .detail-section { margin-bottom: 16px; }
        .detail-section h4 { color: var(--secondary); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .uses-list { list-style: none; }
        .uses-list li { padding: 6px 0; border-bottom: 1px dashed var(--border); display: flex; align-items: center; gap: 8px; }
        .uses-list li i { color: var(--green); }
        .checkout-summary { background: var(--cream); padding: 16px; border-radius: var(--radius-sm); margin: 16px 0; }
        .checkout-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .checkout-row.total { font-weight: 800; font-size: 1.1rem; color: var(--accent); border-top: 2px solid var(--border); padding-top: 8px; margin-top: 8px; }
    </style>
</head>  
<body>  
    <div class="toast-container" id="toastContainer"></div>  
    <div class="loading-overlay" id="loadingOverlay" style="display:none;"><div class="loading-spinner"></div></div>

    <header class="top-header">  
        <a href="javascript:void(0)" onclick="showPage('home')" class="logo"><i class="fa-solid fa-mortar-pestle"></i> طعم‌یار</a>  
        <div class="search-box">  
            <i class="fa-solid fa-search"></i>  
            <input type="text" id="globalSearchInput" placeholder="جستجوی ادویه..." oninput="handleGlobalSearch(this.value)">  
        </div>  
        <button class="header-logout-btn" id="headerLogoutBtn" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
    </header>  

    <div class="admin-top-bar">
        <button class="admin-top-bar-btn" onclick="toggleAdminSidebar()"><i class="fa-solid fa-bars"></i> منو</button>
        <div class="admin-logo"><i class="fa-solid fa-shield-halved"></i><span>پنل مدیریت</span></div>
        <button class="admin-top-bar-btn" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
    </div>

    <main class="container" id="mainContent">  
        <section class="page-section active" id="page-home">  
            <div class="home-hero-banner"><h2>🌟 ادویه‌های تازه و خوش‌عطر 🌟</h2><p>کیفیت بی‌نظیر، طعم اصیل، قیمت مناسب</p><button class="btn btn-primary btn-sm" onclick="showPage('shop')" style="margin-top:12px">🛍️ مشاهده محصولات</button></div>  
            <div class="section-header"><h3>محصولات</h3></div>  
            <div class="product-grid" id="homeFeaturedProducts"></div>  
        </section>  
        <section class="page-section" id="page-shop">  
            <div class="section-header"><h3>🛍️ فروشگاه</h3><a href="javascript:void(0)" onclick="showPage('home')">بازگشت</a></div>  
            <div class="product-grid" id="shopProducts"></div>  
        </section>  
        <section class="page-section" id="page-kitchen"><div id="kitchenContent"></div></section>
        <section class="page-section" id="page-cart">  
            <div class="section-header"><h3>🛒 سبد خرید</h3><a href="javascript:void(0)" onclick="showPage('shop')">بازگشت</a></div>  
            <div id="cartContent"></div>  
        </section>  
        <section class="page-section" id="page-login"><div id="loginContainer"></div></section>
        <section class="page-section" id="page-user-dashboard"><div id="userDashboardContent"></div></section>  
        <section class="page-section" id="page-admin"><div id="adminTabContent"></div></section>  
    </main>  

    <nav class="bottom-nav" id="bottomNav">  
        <a href="javascript:void(0)" class="bottom-nav-item active" onclick="showPage('home')"><i class="fa-solid fa-house"></i><span>خانه</span></a>  
        <a href="javascript:void(0)" class="bottom-nav-item" onclick="showPage('shop')"><i class="fa-solid fa-store"></i><span>فروشگاه</span></a>  
        <a href="javascript:void(0)" class="bottom-nav-item" onclick="showPage('kitchen')"><i class="fa-solid fa-utensils"></i><span>آشپزخانه</span></a>
        <a href="javascript:void(0)" class="bottom-nav-item" onclick="showPage('cart')"><i class="fa-solid fa-shopping-cart"></i><span>سبد</span><span class="badge" id="bottomCartBadge">0</span></a>  
        <a href="javascript:void(0)" class="bottom-nav-item" onclick="showPage('user-dashboard')"><i class="fa-solid fa-user"></i><span>حساب</span></a>  
    </nav>  

    <div class="admin-backdrop" id="adminBackdrop" onclick="toggleAdminSidebar()"></div>  
    <div class="admin-sidebar" id="adminSidebar">  
        <div class="admin-sidebar-header"><h3><i class="fa-solid fa-shield-halved"></i> مدیریت</h3><button class="close-btn" onclick="toggleAdminSidebar()"><i class="fa-solid fa-xmark"></i></button></div>  
        <a href="javascript:void(0)" onclick="showAdminTab('overview'); toggleAdminSidebar();"><i class="fa-solid fa-chart-pie"></i> نمای کلی</a>  
        <a href="javascript:void(0)" onclick="showAdminTab('products'); toggleAdminSidebar();"><i class="fa-solid fa-boxes"></i> محصولات</a>  
        <a href="javascript:void(0)" onclick="showAdminTab('orders'); toggleAdminSidebar();"><i class="fa-solid fa-truck"></i> سفارشات</a>  
        <a href="javascript:void(0)" onclick="showAdminTab('users'); toggleAdminSidebar();"><i class="fa-solid fa-users"></i> کاربران</a>
        <a href="javascript:void(0)" onclick="showAdminTab('messages'); toggleAdminSidebar();"><i class="fa-solid fa-comments"></i> پیام‌ها</a>

        function isWeightAvailable(product, weightId) { const w = getWeightById(product, weightId); return w ? w.stock !== 0 : false; }
        function getEffectivePrice(product, weightId) {  
            const w = getWeightById(product, weightId); if (!w) return 0;
            const discount = weightId === 'w1' ? (product.discount100 || 0) : (product.discount250 || 0);
            return discount > 0 ? Math.round(w.price * (1 - discount/100)) : w.price;

        async function handleRegister() {
            showLoading();
            const name = document.getElementById('regNameInput').value.trim();
            const phone = document.getElementById('regPhoneInput').value.trim();
            const email = `user_${Date.now()}@tamYar.local`;
            const password = Math.random().toString(36).substr(2, 8);
            const userCode = 'taamyar-' + Math.floor(1000 + Math.random() * 9000);

            try {
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email, password: password,
                    options: { data: { name: name, phone: phone, user_code: userCode, role: 'user' } }
                });
                if (authError) throw authError;
                await new Promise(resolve => setTimeout(resolve, 1000));
                const { data: userData, error: userError } = await supabase.from('users').select('*').eq('supabase_auth_id', authData.user.id).single();
                if (userError) throw userError;
                await supabase.from('users').update({ phone: phone }).eq('id', userData.id);
                state.currentUser = { ...userData, userCode: userCode, password: password };
                localStorage.setItem('tamYar_userCode', userCode);
                localStorage.setItem('tamYar_password_' + userCode, password);
                hideLoading();
                showToast('ثبت‌نام موفق! کد کاربری: ' + userCode, 'success');
                showCredentialsModal(userCode, password);
            } catch (error) {
                hideLoading();
                console.error('Register error:', error);
                showToast('خطا در ثبت‌نام: ' + error.message, 'error');
            }
        }

            showLoading();

                const { data: userData, error } = await supabase.from('users').select('*').eq('user_code', userCode).single();
                if (error || !userData) { hideLoading(); showToast('کد کاربری یافت نشد', 'error'); return; }
                const storedPassword = localStorage.getItem('tamYar_password_' + userCode) || userData.password_hash;
                if (storedPassword !== password) { hideLoading(); showToast('رمز عبور اشتباه است', 'error'); return; }

                hideLoading();
                showToast('خوش آمدید ' + (userData.name || 'کاربر'), 'success');
                if (userData.role === 'admin') showPage('admin'); else showPage('home');
            } catch (error) {
                hideLoading();
                showToast('خطا در ورود', 'error');
            }
        }

        function createProductCardHTML(product) {
            if (!product) return '';
            const defaultWeightId = state.selectedWeight[product.id] || 'w1';
            const effPrice = getEffectivePrice(product, defaultWeightId);
            const inCart = state.cart.find(item => item.productId === product.id && item.weightId === defaultWeightId);
            const imageHtml = product.image_url ? `<img src="${product.image_url}">` : `<span style="font-size:2.5rem;">${product.icon}</span>`;
            const weightButtonsHTML = product.weights.map(w => {
                const isSelected = defaultWeightId === w.id;
                const isAvailable = w.stock !== 0;
                const discount = w.id === 'w1' ? (product.discount100 || 0) : (product.discount250 || 0);
                let badgeHTML = '';
                if (!isAvailable) badgeHTML = `<span class="out-of-stock">ناموجود</span>`;
                else if (discount > 0) badgeHTML = `<span class="discount-badge-weight">${discount}٪</span>`;
                return `<button class="${isSelected ? 'selected' : ''}" ${!isAvailable ? 'disabled' : ''} onclick="event.stopPropagation(); selectWeight('${product.id}', '${w.id}')">${w.label}${badgeHTML}</button>`;
            }).join('');
            const canAddToCart = isWeightAvailable(product, defaultWeightId);
            return `<div class="product-card" onclick="showProductDetail('${product.id}')">

                        <button class="btn btn-primary btn-block" ${!canAdd ? 'disabled' : ''} onclick="addToCart('${product.id}', '${selectedW}'); closeModal();"><i class="fa-solid fa-cart-plus"></i> ${!canAdd ? 'ناموجود' : 'افزودن به سبد'}</button>
                    </div>
                </div></div>`;
        }

        function renderShop(searchQuery = '') {
            let filtered = state.products;
            if (searchQuery) filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery) || (p.fullDescription || '').toLowerCase().includes(searchQuery));
            const productsContainer = document.getElementById('shopProducts');
            if (productsContainer) productsContainer.innerHTML = filtered.length > 0 ? filtered.map(p => createProductCardHTML(p)).join('') : '<div class="empty-state"><i class="fa-solid fa-search"></i><p>محصولی یافت نشد</p></div>';
        }

        function addToCart(productId, weightId) {
            const product = state.products.find(p => p.id === productId); if (!product) return;
            if (!isWeightAvailable(product, weightId)) { showToast('این وزن ناموجود است', 'error'); return; }
            const existing = state.cart.find(item => item.productId === productId && item.weightId === weightId);
            if (existing) existing.quantity += 1; else state.cart.push({ productId, weightId, quantity: 1 });
            showToast(`${product.name} اضافه شد`, 'success');
            if (state.activePage === 'shop') renderShop(); else if (state.activePage === 'home') renderHome(); else if (state.activePage === 'cart') renderCart();
            updateCartBadge();
        }

        function removeFromCart(productId, weightId) { state.cart = state.cart.filter(i => !(i.productId === productId && i.weightId === weightId)); updateCartBadge(); renderCart(); }
        function changeCartQty(productId, weightId, delta) { 
            const item = state.cart.find(i => i.productId === productId && i.weightId === weightId); 
            if (item) { item.quantity += delta; if (item.quantity <= 0) removeFromCart(productId, weightId); else { updateCartBadge(); renderCart(); } } 
        }

        function renderKitchen() {
            const container = document.getElementById('kitchenContent'); if (!container) return;
            const shelves = [
                { id: 'iranian', name: 'غذاهای ایرانی', icon: '🇮🇷', color: '#2980b9' },
                { id: 'international', name: 'بین‌المللی', icon: '🌍', color: '#8e44ad' },
                { id: 'appetizer', name: 'پیش‌غذا', icon: '🥗', color: '#27ae60' },
                { id: 'soup', name: 'سوپ و آش', icon: '🥣', color: '#e67e22' },
                { id: 'kebab', name: 'کباب', icon: '🍗', color: '#8B4513' },
                { id: 'pasta', name: 'پاستا', icon: '🍝', color: '#ff5722' },
                { id: 'dessert', name: 'دسر', icon: '🍰', color: '#e91e63' },
                { id: 'drink', name: 'نوشیدنی', icon: '🍵', color: '#9b59b6' }
            ];
            const shelfCounts = {};
            shelves.forEach(s => { shelfCounts[s.id] = state.recipes.filter(r => r.shelf === s.id).length; });
            container.innerHTML = `
                <div class="kitchen-hero"><h2>👩‍🍳 آشپزخانه طعم‌یار</h2><p>بیش از ${state.recipes.length} دستور پخت متنوع</p></div>
                <div class="section-header"><h3>🗄️ قفسه‌ها</h3></div>
                <div class="kitchen-shelves">
                    ${shelves.map(s => `<div class="kitchen-shelf ${state.kitchenShelf === s.id ? 'active' : ''}" onclick="selectKitchenShelf('${s.id}')" style="--shelf-color: ${s.color};"><span class="shelf-icon">${s.icon}</span><div class="shelf-name">${s.name}</div><div class="shelf-count">${shelfCounts[s.id] || 0} دستور</div></div>`).join('')}
                </div>
                <div id="kitchenContentArea"></div>`;
            renderKitchenContent();
        }

        function selectKitchenShelf(shelfId) {
            state.kitchenShelf = shelfId; renderKitchen();
            setTimeout(() => { const contentArea = document.getElementById('kitchenContentArea'); if (contentArea) contentArea.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
        }

        function renderKitchenContent() {
            const contentArea = document.getElementById('kitchenContentArea'); if (!contentArea) return;
            const recipes = state.kitchenShelf === 'all' ? state.recipes : state.recipes.filter(r => r.shelf === state.kitchenShelf);
            const shelves = [{ id: 'iranian', name: 'غذاهای ایرانی', icon: '🇮🇷' }, { id: 'international', name: 'بین‌المللی', icon: '🌍' }, { id: 'appetizer', name: 'پیش‌غذا', icon: '🥗' }, { id: 'soup', name: 'سوپ و آش', icon: '🥣' }, { id: 'kebab', name: 'کباب', icon: '🍗' }, { id: 'pasta', name: 'پاستا', icon: '🍝' }, { id: 'dessert', name: 'دسر', icon: '🍰' }, { id: 'drink', name: 'نوشیدنی', icon: '🍵' }];
            contentArea.innerHTML = `<div class="section-header"><h3>🍳 دستور پخت‌ها (${recipes.length})</h3></div>${recipes.map(r => {
                const shelf = shelves.find(s => s.id === r.shelf);
                const imageHtml = r.image_url ? `<img src="${r.image_url}">` : `<span style="font-size:4rem;">${r.icon}</span>`;
                return `<div class="recipe-card" onclick="showRecipeDetail('${r.id}')"><div class="recipe-image">${imageHtml}${shelf ? `<span class="recipe-category-badge">${shelf.icon} ${shelf.name}</span>` : ''}</div><div class="recipe-body"><div class="recipe-title">${r.title}</div><div class="recipe-desc">${r.description}</div><div class="recipe-spices">${r.spices.map(spiceId => { const p = state.products.find(p => p.id === spiceId); return p ? `<span class="spice-tag" onclick="event.stopPropagation(); showProductDetail('${p.id}')">${p.icon} ${p.name}</span>` : ''; }).join('')}</div><div class="recipe-meta"><span><i class="fa-regular fa-clock"></i> ${r.cookTime}</span><span><i class="fa-solid fa-users"></i> ${r.servings}</span><span><i class="fa-solid fa-signal"></i> ${r.difficulty}</span></div></div></div>`;
            }).join('')}`;
        }

        function showRecipeDetail(recipeId) {
            const recipe = state.recipes.find(r => r.id === recipeId); if (!recipe) return;
            const spices = recipe.spices.map(spiceId => { const product = state.products.find(p => p.id === spiceId); return product ? { id: spiceId, name: product.name, icon: product.icon, price: getEffectivePrice(product, 'w1'), weightId: 'w1' } : null; }).filter(Boolean);
            const imageHtml = recipe.image_url ? `<img src="${recipe.image_url}">` : `<span style="font-size:5rem;">${recipe.icon}</span>`;
            document.getElementById('modalContainer').innerHTML = `
                <div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:600px;">
                    <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                    <div class="detail-hero">${imageHtml}</div>
                    <h3>${recipe.title}</h3><p style="color:var(--text-light);margin-bottom:16px;">${recipe.description}</p>
                    <div style="display:flex;justify-content:space-around;background:var(--cream);padding:14px;border-radius:var(--radius-sm);margin-bottom:20px;">
                        <div style="text-align:center;"><i class="fa-regular fa-clock" style="font-size:1.5rem;color:var(--accent);"></i><div style="font-size:0.85rem;margin-top:4px;">${recipe.cookTime}</div></div>
                        <div style="text-align:center;"><i class="fa-solid fa-users" style="font-size:1.5rem;color:var(--accent);"></i><div style="font-size:0.85rem;margin-top:4px;">${recipe.servings}</div></div>
                        <div style="text-align:center;"><i class="fa-solid fa-signal" style="font-size:1.5rem;color:var(--accent);"></i><div style="font-size:0.85rem;margin-top:4px;">${recipe.difficulty}</div></div>
                    </div>
                    <div class="recipe-detail-section"><h4><i class="fa-solid fa-pepper-hot"></i> ادویه‌های لازم</h4><p style="font-size:0.85rem;color:var(--text-light);margin-bottom:10px;">💡 روی نام ادویه بزنید تا جزئیات را ببینید</p><div>${spices.map(s => `<div class="recipe-spice-item"><div class="spice-info" onclick="closeModal(); setTimeout(()=>showProductDetail('${s.id}'), 100);"><span style="font-size:1.5rem;">${s.icon}</span><div style="flex:1;"><div style="font-weight:700;">${s.name}</div><div style="font-size:0.8rem;color:var(--text-light);">برای مشاهده جزئیات کلیک کنید</div></div></div><div style="display:flex;align-items:center;gap:8px;"><span style="font-weight:700;color:var(--accent);font-size:0.9rem;">${formatPrice(s.price)} ت</span><button class="btn btn-primary btn-sm" onclick="addToCart('${s.id}', '${s.weightId}'); showToast('به سبد اضافه شد', 'success');"><i class="fa-solid fa-cart-plus"></i></button></div></div>`).join('')}</div></div>
                    <div class="recipe-detail-section"><h4><i class="fa-solid fa-basket-shopping"></i> مواد لازم</h4><ul>${recipe.ingredients.map(ing => `<li><i class="fa-solid fa-check"></i> ${ing}</li>`).join('')}</ul></div>
                    <div class="recipe-detail-section"><h4><i class="fa-solid fa-list-ol"></i> طرز تهیه</h4><ol>${recipe.steps.map((step, idx) => `<li><strong>مرحله ${idx + 1}:</strong> ${step}</li>`).join('')}</ol></div>
                    <button class="btn btn-primary btn-block" onclick="addRecipeSpicesToCart('${recipe.id}')"><i class="fa-solid fa-cart-plus"></i> افزودن همه ادویه‌ها به سبد</button>
                </div></div>`;
        }

        function addRecipeSpicesToCart(recipeId) {
            const recipe = state.recipes.find(r => r.id === recipeId); if (!recipe) return;
            recipe.spices.forEach(spiceId => {
                const product = state.products.find(p => p.id === spiceId);
                if (product && isWeightAvailable(product, 'w1')) {
                    const existing = state.cart.find(item => item.productId === spiceId && item.weightId === 'w1');
                    if (existing) existing.quantity += 1; else state.cart.push({ productId: spiceId, weightId: 'w1', quantity: 1 });
                }
            });
            updateCartBadge(); showToast('همه ادویه‌ها به سبد اضافه شدند 🎉', 'success'); closeModal();
        }

        function renderCart() {
            const container = document.getElementById('cartContent'); if (!container) return;
            if (state.cart.length === 0) { container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-shopping-cart"></i><p>سبد خالی است</p><button class="btn btn-primary btn-sm" onclick="showPage('shop')">رفتن به فروشگاه</button></div>`; return; }
            let subtotal = state.cart.reduce((sum, item) => { const p = state.products.find(p => p.id === item.productId); return sum + (p ? getEffectivePrice(p, item.weightId) * item.quantity : 0); }, 0);
            const shipping = 35000, vat = Math.round((subtotal * 9) / 100), total = subtotal + shipping + vat;
            const itemsHTML = state.cart.map(item => {
                const product = state.products.find(p => p.id === item.productId); if (!product) return '';
                const weight = getWeightById(product, item.weightId); const price = getEffectivePrice(product, item.weightId); const subtotalItem = price * item.quantity;
                return `<div style="background:#fff;border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:10px;"><div style="font-size:1.8rem;">${product.icon}</div><div style="flex:1;"><div style="font-weight:700;">${product.name}</div><div style="font-size:0.8rem;color:var(--text-light);">${weight ? weight.label : ''}</div><div style="font-weight:700;color:var(--accent);">${formatPrice(subtotalItem)} تومان</div></div><div style="display:flex;gap:4px;"><button onclick="changeCartQty('${product.id}', '${item.weightId}', -1)" style="background:var(--cream);width:28px;height:28px;border-radius:50%;">−</button><span style="font-weight:700;">${item.quantity}</span><button onclick="changeCartQty('${product.id}', '${item.weightId}', 1)" style="background:var(--cream);width:28px;height:28px;border-radius:50%;">+</button></div><button class="btn btn-danger btn-sm" onclick="removeFromCart('${product.id}', '${item.weightId}')"><i class="fa-solid fa-trash"></i></button></div>`;
            }).join('');
            container.innerHTML = `${itemsHTML}<div class="checkout-summary"><div class="checkout-row"><span>جمع:</span><span>${formatPrice(subtotal)} تومان</span></div><div class="checkout-row"><span>ارسال:</span><span>${formatPrice(shipping)} تومان</span></div><div class="checkout-row"><span>مالیات (9%):</span><span>${formatPrice(vat)} تومان</span></div><div class="checkout-row total"><span>مبلغ قابل پرداخت:</span><span>${formatPrice(total)} تومان</span></div></div><div style="background:#fff;border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow-sm);"><button class="btn btn-primary btn-block" onclick="showCheckoutModal()">تسویه حساب</button></div>`;
        }

        async function showCheckoutModal() {
            if (!state.currentUser) { showToast('لطفاً ابتدا وارد حساب شوید', 'error'); showPage('login'); return; }
            if (!state.currentUser.phone || !state.currentUser.address || !state.currentUser.city) { showProfileCompletionModal(); return; }
            let subtotal = state.cart.reduce((sum, item) => { const p = state.products.find(p => p.id === item.productId); return sum + (p ? getEffectivePrice(p, item.weightId) * item.quantity : 0); }, 0);
            const shipping = 35000, vat = Math.round((subtotal * 9) / 100), total = subtotal + shipping + vat;
            document.getElementById('modalContainer').innerHTML = `
                <div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:550px;">
                    <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                    <h3 style="margin-bottom:16px;">💳 تسویه حساب</h3>
                    <div style="background:var(--cream);padding:12px;border-radius:var(--radius-sm);margin-bottom:16px;font-size:0.9rem;"><strong>نام:</strong> ${state.currentUser.name || 'ثبت نشده'}<br><strong>تلفن:</strong> ${state.currentUser.phone || 'ثبت نشده'}<br><strong>آدرس:</strong> ${state.currentUser.address || 'ثبت نشده'}، ${state.currentUser.city || ''}</div>
                    <div class="checkout-summary"><div class="checkout-row"><span>جمع:</span><span>${formatPrice(subtotal)} تومان</span></div><div class="checkout-row"><span>ارسال:</span><span>${formatPrice(shipping)} تومان</span></div><div class="checkout-row"><span>مالیات:</span><span>${formatPrice(vat)} تومان</span></div><div class="checkout-row total"><span>مبلغ قابل پرداخت:</span><span>${formatPrice(total)} تومان</span></div></div>
                    <div style="margin-bottom:16px;"><div style="background:var(--cream);padding:12px;border-radius:var(--radius-sm);"><div style="font-weight:700;margin-bottom:8px;">💳 شماره کارت فروشگاه:</div><div style="font-family:monospace;font-size:1.1rem;direction:ltr;text-align:center;">6037991122334455</div><div style="text-align:center;margin-top:8px;">فروشگاه طعم‌یار</div><button class="btn btn-secondary btn-sm btn-block" style="margin-top:8px;" onclick="copyToClipboard('6037991122334455')"><i class="fa-regular fa-copy"></i> کپی شماره کارت</button></div></div>
                    <div style="margin-bottom:16px;"><label style="font-size:0.85rem;font-weight:700;">شماره کارت شما (پرداخت کننده):</label><input type="text" id="userCardNumber" placeholder="16 رقم" maxlength="19" style="margin-top:6px; direction:ltr; text-align:left;" oninput="formatCardInput(this)"></div>
                    <div style="margin-bottom:16px;"><label style="font-size:0.85rem;font-weight:700;">ارسال فیش واریزی:</label><select id="receiptType" onchange="toggleReceiptType()" style="margin-top:6px;margin-bottom:8px;"><option value="text">توضیحات متنی (شماره پیگیری)</option><option value="image">آپلود تصویر فیش</option></select><textarea id="receiptText" placeholder="شماره پیگیری تراکنش..." style="margin-bottom:12px;"></textarea><input type="file" id="receiptImage" accept="image/*" style="display:none;margin-bottom:12px;"></div>
                    <button class="btn btn-primary btn-block" onclick="processOrder(${subtotal}, ${shipping}, ${vat}, ${total})"><i class="fa-solid fa-check-circle"></i> ثبت سفارش نهایی</button>
                </div></div>`;
        }

        function showProfileCompletionModal() {
            const u = state.currentUser;
            document.getElementById('modalContainer').innerHTML = `
                <div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
                    <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                    <h3 style="margin-bottom:16px;color:var(--accent);"><i class="fa-solid fa-user-plus"></i> تکمیل اطلاعات</h3>
                    <p style="font-size:0.85rem;color:var(--text-light);margin-bottom:16px;">لطفاً اطلاعات زیر را تکمیل کنید تا بتوانید سفارش ثبت کنید.</p>
                    <div style="margin-bottom:10px;"><label style="font-size:0.9rem;font-weight:700;">نام و نام خانوادگی *</label><input type="text" id="regName" value="${u.name || ''}"></div>
                    <div style="margin-bottom:10px;"><label style="font-size:0.9rem;font-weight:700;">شماره موبایل *</label><input type="tel" id="regPhone" value="${u.phone || ''}" placeholder="09123456789"></div>
                    <div style="margin-bottom:10px;"><label style="font-size:0.9rem;font-weight:700;">شهر *</label><input type="text" id="regCity" value="${u.city || ''}"></div>
                    <div style="margin-bottom:10px;"><label style="font-size:0.9rem;font-weight:700;">آدرس کامل *</label><textarea id="regAddress" rows="3">${u.address || ''}</textarea></div>
                    <div style="margin-bottom:10px;"><label style="font-size:0.9rem;font-weight:700;">کد پستی</label><input type="text" id="regPostal" value="${u.postal_code || u.postalCode || ''}" maxlength="10" placeholder="10 رقم"></div>
                    <button class="btn btn-primary btn-block" onclick="saveProfileAndContinue()"><i class="fa-solid fa-check"></i> ذخیره و ادامه</button>
                </div></div>`;
        }

        async function saveProfileAndContinue() {
            showLoading();
            const name = document.getElementById('regName').value.trim(), phone = document.getElementById('regPhone').value.trim(), city = document.getElementById('regCity').value.trim(), address = document.getElementById('regAddress').value.trim(), postalCode = document.getElementById('regPostal').value.trim();
            try {
                const { error } = await supabase.from('users').update({ name, phone, city, address, postal_code: postalCode }).eq('id', state.currentUser.id);
                if (error) throw error;
                state.currentUser = { ...state.currentUser, name, phone, city, address, postal_code: postalCode, postalCode };
                hideLoading(); showToast('اطلاعات ذخیره شد', 'success'); closeModal(); setTimeout(() => showCheckoutModal(), 300);
            } catch (error) { hideLoading(); showToast('خطا در ذخیره اطلاعات', 'error'); }
        }

        function formatCardInput(input) { let val = input.value.replace(/\D/g, '').substring(0, 16); input.value = val.replace(/(\d{4})/g, '$1 ').trim(); }
        function toggleReceiptType() { const type = document.getElementById('receiptType').value; document.getElementById('receiptText').style.display = type === 'text' ? 'block' : 'none'; document.getElementById('receiptImage').style.display = type === 'image' ? 'block' : 'none'; }
        function copyToClipboard(text) { if (!text) return; navigator.clipboard.writeText(text).then(() => showToast('کپی شد', 'success')); }

        async function processOrder(subtotal, shipping, vat, total) {
            showLoading();
            const userCard = document.getElementById('userCardNumber').value.replace(/\s/g, '');
            if (userCard.length < 16) { hideLoading(); showToast('شماره کارت را وارد کنید', 'error'); return; }
            const rType = document.getElementById('receiptType').value;
            let receiptInfo = '', receiptImageUrl = null;
            if (rType === 'text') {
                receiptInfo = document.getElementById('receiptText').value;
                if (!receiptInfo) { hideLoading(); showToast('شماره پیگیری را وارد کنید', 'error'); return; }
            } else {
                const file = document.getElementById('receiptImage').files[0];
                if (!file) { hideLoading(); showToast('تصویر فیش را انتخاب کنید', 'error'); return; }
                const fileExt = file.name.split('.').pop();
                const fileName = `receipt_${Date.now()}.${fileExt}`;
                const { error: uploadError } = await supabase.storage.from('images').upload(fileName, file);
                if (uploadError) { hideLoading(); showToast('خطا در آپلود تصویر', 'error'); return; }
                const { data: urlData } = supabase.storage.from('images').getPublicUrl(fileName);
                receiptImageUrl = urlData.publicUrl;
                receiptInfo = 'تصویر فیش آپلود شد';
            }
            try {
                const { error } = await supabase.from('orders').insert([{
                    user_id: state.currentUser.id, user_code: state.currentUser.userCode, user_name: state.currentUser.name, user_phone: state.currentUser.phone,
                    user_address: state.currentUser.address, user_city: state.currentUser.city, user_postal_code: state.currentUser.postal_code || state.currentUser.postalCode,
                    items: state.cart, subtotal: subtotal, discount: 0, shipping: shipping, vat: vat, total: total,
                    payer_card_number: userCard, receipt_info: receiptInfo, receipt_image_url: receiptImageUrl, status: 'pending'
                }]).select().single();
                if (error) throw error;
                state.cart = []; updateCartBadge(); hideLoading(); closeModal();
                showToast('سفارش ثبت شد و در انتظار تایید پرداخت 🎉', 'success');
                showPage('user-dashboard');
            } catch (error) { hideLoading(); showToast('خطا در ثبت سفارش', 'error'); }
        }

        async function renderUserDashboard() {
            if (!state.currentUser) { showPage('login'); return; }
            const container = document.getElementById('userDashboardContent'); if (!container) return;
            container.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;"><h3>حساب من</h3><div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-secondary btn-sm" onclick="showUserTab('profile')">پروفایل</button><button class="btn btn-secondary btn-sm" onclick="showUserTab('orders')">سفارشات</button><button class="btn btn-secondary btn-sm" onclick="showUserTab('messages')">پیام‌ها</button><button class="btn btn-danger btn-sm" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button></div></div><div id="userTabContent"></div>`;
            showUserTab(state.userTab || 'profile');
        }

        async function showUserTab(tab) {
            state.userTab = tab;
            const container = document.getElementById('userTabContent'); if (!container) return;
            const user = state.currentUser;
            if (tab === 'profile') {

                const { error } = await supabase.from('users').update({ name, phone, city, address, postal_code: postalCode }).eq('id', state.currentUser.id);
                if (error) throw error;
                state.currentUser = { ...state.currentUser, name, phone, city, address, postal_code: postalCode, postalCode };

            } catch (error) { hideLoading(); showToast('خطا در ذخیره', 'error'); }

        async function sendMessage() {
            showLoading();

            if (!subject || !body) { hideLoading(); showToast('موضوع و متن را وارد کنید', 'error'); return; }
            try {
                const { error } = await supabase.from('messages').insert([{ user_id: state.currentUser.id, user_name: state.currentUser.name, subject: subject, body: body, status: 'unread' }]);
                if (error) throw error;
                hideLoading(); showToast('پیام ارسال شد', 'success'); showUserTab('messages');
            } catch (error) { hideLoading(); showToast('خطا در ارسال پیام', 'error'); }

        function previewProductImage(event) {
            const file = event.target.files[0];

                const reader = new FileReader();
                reader.onload = function(e) { tempProductImage = file; const preview = document.getElementById('prodImagePreview'); preview.src = e.target.result; preview.style.display = 'block'; };
                reader.readAsDataURL(file);
            }
        }

        async function addProduct(e) {
            e.preventDefault(); showLoading();
            let imageUrl = null;
            if (tempProductImage) {
                const fileExt = tempProductImage.name.split('.').pop();
                const fileName = `product_${Date.now()}.${fileExt}`;
                const { error: uploadError } = await supabase.storage.from('images').upload(fileName, tempProductImage);

                if (!uploadError) {
                    const { data: urlData } = supabase.storage.from('images').getPublicUrl(fileName);

                }

            p.name = document.getElementById('prodName').value; p.icon = document.getElementById('prodIcon').value;
            p.fullDescription = document.getElementById('prodDesc').value; p.uses = document.getElementById('prodUses').value;

            p.discount100 = parseInt(document.getElementById('w1Discount').value) || 0; p.discount250 = parseInt(document.getElementById('w2Discount').value) || 0;

            hideLoading();

        let tempRecipeImage = null;

            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { tempRecipeImage = file; const preview = document.getElementById('recipeImagePreview'); preview.src = e.target.result; preview.style.display = 'block'; };
                reader.readAsDataURL(file);
            }
        }

        async function addRecipe(e) {
            e.preventDefault(); showLoading();
            const spiceChecks = document.querySelectorAll('.recipe-spice-check:checked');
            const spices = Array.from(spiceChecks).map(cb => cb.value);
            const ingredients = document.getElementById('recipeIngredients').value.split('\n').filter(i => i.trim());
            const steps = document.getElementById('recipeSteps').value.split('\n').filter(s => s.trim());
            let imageUrl = null;

                const fileExt = tempRecipeImage.name.split('.').pop();
                const fileName = `recipe_${Date.now()}.${fileExt}`;
                const { error: uploadError } = await supabase.storage.from('images').upload(fileName, tempRecipeImage);
                if (!uploadError) {
                    const { data: urlData } = supabase.storage.from('images').getPublicUrl(fileName);
                    imageUrl = urlData.publicUrl;

        }

        function showEditRecipeForm(id) {
            const r = state.recipes.find(r => r.id === id); if (!r) return;
            const c = document.getElementById('adminTabContent');
            const shelves = [{ id: 'iranian', name: 'غذاهای ایرانی', icon: '🇮🇷' }, { id: 'international', name: 'بین‌المللی', icon: '🌍' }, { id: 'appetizer', name: 'پیش‌غذا', icon: '🥗' }, { id: 'soup', name: 'سوپ و آش', icon: '🥣' }, { id: 'kebab', name: 'کباب', icon: '🍗' }, { id: 'pasta', name: 'پاستا', icon: '🍝' }, { id: 'dessert', name: 'دسر', icon: '🍰' }, { id: 'drink', name: 'نوشیدنی', icon: '🍵' }];
            tempRecipeImage = null;
            c.innerHTML = `<div style="background:#fff;border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow-sm);">

                <form onsubmit="editRecipe(event, '${id}')">

                        <p style="font-size:0.85rem;color:var(--text-light);margin-top:8px;">برای تغییر تصویر کلیک کنید</p>

        async function deleteRecipe(id) {
            if (!confirm('حذف شود؟')) return;
            showLoading();
            const { error } = await supabase.from('recipes').delete().eq('id', id);
            hideLoading();
            if (error) showToast('خطا در حذف', 'error');
            else { state.recipes = state.recipes.filter(r => r.id !== id); showToast('حذف شد', 'success'); showAdminTab('recipes'); }
        }

        // ==================== INITIALIZATION ====================
        async function init() {
            showLoading();
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                const { data: userData, error } = await supabase.from('users').select('*').eq('supabase_auth_id', session.user.id).single();
                if (userData && !error) {
                    state.currentUser = userData;
                    const storedPassword = localStorage.getItem('tamYar_password_' + userData.user_code);
                    if (storedPassword) { state.currentUser.password = storedPassword; state.currentUser.userCode = userData.user_code; }
                    hideLoading();
                    if (userData.role === 'admin') showPage('admin'); else showPage('home');
                } else { hideLoading(); showPage('login'); }
            } else { hideLoading(); showPage('login'); }
            
            const [productsRes, recipesRes] = await Promise.all([
                supabase.from('products').select('*').order('id'),
                supabase.from('recipes').select('*').order('id')
            ]);
            if (productsRes.data && productsRes.data.length > 0) state.products = productsRes.data;
            if (recipesRes.data && recipesRes.data.length > 0) state.recipes = recipesRes.data;
            updateCartBadge();
        }
        init();
    </script>
