<!DOCTYPE html>
<html lang="fa" dir="rtl">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">  
    <title>🌶️ ادویه سرا | فروشگاه آنلاین ادویه و گیاهان معطر</title>  
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">  
    <style>  
        :root {  
            --bg: #f7f5f2; --card-bg: #ffffff; --text: #1a1815; --text-light: #6b6560;  
            --accent: #c0392b; --accent-hover: #a93226; --secondary: #8B4513;  
            --gold: #D4A017; --green: #27ae60; --cream: #f5ede3; --border: #e8ddd0;  
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04); --shadow-md: 0 4px 16px rgba(0,0,0,0.08);  
            --radius: 14px; --radius-sm: 10px; --radius-lg: 22px; --font: 'Vazirmatn', sans-serif;  
            --bottom-nav-height: 64px; --top-header-height: 60px;  
        }  
        * { margin: 0; padding: 0; box-sizing: border-box; }  
        body {  
            font-family: var(--font); background: var(--bg); color: var(--text);  
            line-height: 1.7; min-height: 100vh; overflow-x: hidden;  
            padding-bottom: var(--bottom-nav-height); -webkit-tap-highlight-color: transparent;  
        }  
        body.admin-mode { padding-bottom: 0; background: #f0f0f0; }
        body.admin-mode .top-header, body.admin-mode .bottom-nav { display: none; }

        ::-webkit-scrollbar { width: 6px; }  
        ::-webkit-scrollbar-track { background: var(--cream); }  
        ::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 3px; }  

        a { text-decoration: none; color: inherit; }  
        button { cursor: pointer; font-family: var(--font); border: none; outline: none; transition: 0.2s; background: none; }  
        input, select, textarea {  
            font-family: var(--font); outline: none; border: 1.5px solid var(--border);  
            border-radius: var(--radius-sm); padding: 10px 14px; font-size: 0.95rem;  
            transition: 0.2s; background: #fff; width: 100%;  
        }  
        input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(192,57,43,0.08); }  
        textarea { resize: vertical; min-height: 90px; }  

        .container { max-width: 600px; margin: 0 auto; padding: 0 12px; }  
        body.admin-mode .container { max-width: 100%; padding: 0 16px; }

        .page-section { display: none; animation: fadeIn 0.3s ease-in-out; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .top-header {  
            background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000;  
            padding: 8px 12px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow-sm); height: var(--top-header-height);  
        }  
        .top-header .logo { font-size: 1.4rem; font-weight: 900; color: var(--accent); display: flex; align-items: center; gap: 6px; }  
        .top-header .search-box {  
            flex: 1; background: var(--cream); border-radius: 50px; padding: 6px 12px;  
            display: flex; align-items: center; gap: 8px; border: 1px solid transparent;  
        }  
        .top-header .search-box input { border: none; background: transparent; padding: 4px 0; font-size: 0.9rem; width: 100%; }  

        .bottom-nav {  
            position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border);  
            display: flex; justify-content: space-around; align-items: center; height: var(--bottom-nav-height); z-index: 1000;  
            box-shadow: 0 -2px 12px rgba(0,0,0,0.06);  
        }  
        .bottom-nav-item {  
            display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.7rem; color: var(--text-light);  
            padding: 4px 8px; border-radius: 12px; min-width: 56px; cursor: pointer; position: relative;  
        }  
        .bottom-nav-item i { font-size: 1.3rem; }  
        .bottom-nav-item.active { color: var(--accent); background: rgba(192,57,43,0.06); }  
        .bottom-nav-item .badge {  
            position: absolute; top: 2px; right: 12px; background: var(--accent); color: #fff;  
            font-size: 0.65rem; width: 16px; height: 16px; border-radius: 50%; display: flex;  
            align-items: center; justify-content: center; font-weight: 700; display: none;  
        }  

        .admin-top-bar {
            display: none; background: linear-gradient(135deg, #1f140e 0%, #3a2417 100%); color: #fff;
            padding: 12px 16px; position: sticky; top: 0; z-index: 1000; box-shadow: var(--shadow-md);
            align-items: center; gap: 12px;
        }
        body.admin-mode .admin-top-bar { display: flex; }
        .admin-top-bar .admin-logo { font-size: 1.1rem; font-weight: 800; color: var(--gold); display: flex; align-items: center; gap: 8px; flex: 1; }
        .admin-top-bar-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff;
            padding: 8px 12px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 6px; font-size: 0.85rem;
        }

        .admin-sidebar {  
            position: fixed; top: 0; right: -300px; width: 300px; height: 100%; background: #1f140e; color: #fff; z-index: 2000;  
            transition: right 0.3s cubic-bezier(0.4,0,0.2,1); box-shadow: var(--shadow-lg); padding: 16px; overflow-y: auto;  
        }  
        .admin-sidebar.open { right: 0; }  
        .admin-sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }  
        .admin-sidebar a {  
            display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--radius-sm); color: #ddd;  
            font-size: 0.9rem; margin-bottom: 4px; transition: 0.2s; cursor: pointer;  
        }  
        .admin-sidebar a:hover, .admin-sidebar a.active { background: rgba(255,255,255,0.1); color: #fff; }  
        .admin-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1500; display: none; }  
        .admin-backdrop.show { display: block; }  

        .home-hero-banner {  
            background: linear-gradient(135deg, #3a2417, #6b3a1f); border-radius: var(--radius-lg); padding: 20px 16px; margin: 16px 0;  
            color: #fff; text-align: center; position: relative; overflow: hidden;  
        }  
        .section-header { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 12px; }  
        .section-header h3 { font-size: 1.1rem; font-weight: 800; }  
        .section-header a { font-size: 0.8rem; color: var(--accent); }  

        .category-carousel { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px; }  
        .category-carousel .cat-item {  
            min-width: 80px; text-align: center; background: #fff; border-radius: var(--radius-sm);  
            padding: 10px 6px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); cursor: pointer;  
        }  
        .category-carousel .cat-item span { font-size: 1.8rem; display: block; margin-bottom: 4px; }  
        .category-carousel .cat-item small { font-size: 0.7rem; color: var(--text-light); }  

        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }  
        .product-card {  
            background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm);  
            border: 1px solid var(--border); display: flex; flex-direction: column; cursor: pointer;  
        }  
        .product-image { height: 130px; background: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; position: relative; }  
        .product-image img { width: 100%; height: 100%; object-fit: cover; }  
        .product-body { padding: 10px 12px; flex: 1; display: flex; flex-direction: column; gap: 6px; }  
        .product-name { font-weight: 700; font-size: 0.9rem; }  
        .product-price { font-weight: 800; color: var(--accent); font-size: 0.95rem; }  
        .add-to-cart-btn {  
            background: var(--accent); color: #fff; padding: 8px 12px; border-radius: 30px;  
            font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 4px;  
        }  

        .blog-card { background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border); cursor: pointer; margin-bottom: 12px;}  
        .blog-image { height: 140px; background: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }  
        .blog-image img { width: 100%; height: 100%; object-fit: cover; }  
        .blog-body { padding: 12px; }  
        .blog-title { font-weight: 800; font-size: 0.9rem; margin-bottom: 4px; }  
        .blog-excerpt { font-size: 0.8rem; color: var(--text-light); }  
        .blog-category-tag { display: inline-block; background: var(--cream); color: var(--secondary); padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; margin-bottom: 6px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(4px); }  
        .modal { background: #fff; border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative; }  
        .modal-close { position: absolute; top: 16px; left: 16px; font-size: 1.3rem; color: var(--text-light); cursor: pointer; }  

        .toast-container { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 4000; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }  
        body.admin-mode .toast-container { bottom: 20px; }
        .toast { padding: 10px 20px; border-radius: 30px; background: #333; color: #fff; font-size: 0.85rem; box-shadow: var(--shadow-md); }  
        .toast.success { background: var(--green); } .toast.error { background: #e74c3c; }

        .btn { padding: 10px 18px; border-radius: 30px; font-weight: 700; font-size: 0.9rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }  
        .btn-primary { background: var(--accent); color: #fff; } .btn-primary:hover { background: var(--accent-hover); }  
        .btn-secondary { background: var(--cream); color: var(--text); } .btn-danger { background: #e74c3c; color: #fff; }  
        .btn-sm { padding: 6px 12px; font-size: 0.75rem; border-radius: 20px; } .btn-block { width: 100%; }  

        .empty-state { text-align: center; padding: 30px 16px; color: var(--text-light); }  
        .empty-state i { font-size: 2.5rem; margin-bottom: 8px; }  

        /* Product Detail Modal Styles */
        .detail-hero { width: 100%; height: 200px; background: var(--cream); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 4rem; margin-bottom: 16px; overflow: hidden; }
        .detail-hero img { width: 100%; height: 100%; object-fit: cover; }
        .detail-section { margin-bottom: 16px; }
        .detail-section h4 { color: var(--secondary); font-size: 1rem; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .detail-section p { font-size: 0.9rem; color: var(--text-light); line-height: 1.8; }
        .uses-list { list-style: none; padding: 0; }
        .uses-list li { font-size: 0.9rem; color: var(--text); padding: 6px 0; border-bottom: 1px dashed var(--border); display: flex; align-items: center; gap: 8px; }
        .uses-list li i { color: var(--green); font-size: 0.8rem; }

        /* Bank Card Styles */
        .bank-card-preview {
            background: linear-gradient(135deg, #004b87 0%, #002a4d 100%);
            border-radius: 16px; padding: 20px; color: #fff; margin: 16px 0; position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2); direction: ltr; text-align: left;
        }
        .bank-card-preview .bank-name { font-size: 1.1rem; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .bank-card-preview .card-number { font-size: 1.4rem; letter-spacing: 2px; font-family: monospace; margin-bottom: 20px; direction: ltr; text-align: left; }
        .bank-card-preview .card-holder { font-size: 0.9rem; text-transform: uppercase; opacity: 0.9; }
        .bank-card-preview .chip { width: 40px; height: 30px; background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%); border-radius: 6px; position: absolute; top: 20px; right: 20px; }

        .checkout-summary { background: var(--cream); padding: 16px; border-radius: var(--radius-sm); margin: 16px 0; }
        .checkout-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
        .checkout-row.total { font-weight: 800; font-size: 1.1rem; color: var(--accent); border-top: 2px solid var(--border); padding-top: 8px; margin-top: 8px; }

        @media (max-width: 400px) { .product-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } .product-image { height: 100px; } }  
    </style>
</head>  
<body>  
    <div class="toast-container" id="toastContainer"></div>  

    <header class="top-header">  
        <a href="javascript:void(0)" onclick="showPage('home')" class="logo"><i class="fa-solid fa-mortar-pestle"></i> ادویه‌سرا</a>  
        <div class="search-box">  
            <i class="fa-solid fa-search"></i>  
            <input type="text" id="globalSearchInput" placeholder="جستجوی ادویه..." oninput="handleGlobalSearch(this.value)">  
        </div>  
    </header>  

    <div class="admin-top-bar">
        <button class="admin-top-bar-btn" onclick="toggleAdminSidebar()"><i class="fa-solid fa-bars"></i> منو</button>
        <div class="admin-logo"><i class="fa-solid fa-shield-halved"></i><span>پنل مدیریت</span></div>
        <button class="admin-top-bar-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>

    <main class="container" id="mainContent">  
        <section class="page-section active" id="page-home">  
            <div class="home-hero-banner">  
                <h2>🌟 ادویه‌های تازه و خوش‌عطر 🌟</h2>  
                <p>کیفیت بی‌نظیر، طعم اصیل، قیمت مناسب</p>  
                <button class="btn btn-primary btn-sm" onclick="showPage('shop')" style="margin-top:12px">🛍️ مشاهده محصولات</button>  
            </div>  
            <div id="announcementBanner" style="background:var(--gold); color:#333; border-radius:var(--radius-sm); padding:10px; text-align:center; margin:8px 0; font-size:0.9rem; display:none;">  
                <i class="fa-solid fa-bullhorn"></i> <span id="announcementText"></span>  
            </div>  
            <div class="section-header"><h3>دسته‌بندی‌ها</h3><a href="javascript:void(0)" onclick="showPage('shop')">مشاهده همه</a></div>  
            <div class="category-carousel" id="homeCategoryChips"></div>  
            <div class="section-header"><h3>پرفروش‌ترین‌ها</h3><a href="javascript:void(0)" onclick="showPage('shop')">مشاهده همه</a></div>  
            <div class="product-grid" id="homeFeaturedProducts"></div>  
        </section>  

        <section class="page-section" id="page-shop">  
            <div class="section-header"><h3>🛍️ فروشگاه</h3><a href="javascript:void(0)" onclick="showPage('home')"><i class="fa-solid fa-arrow-right"></i> بازگشت</a></div>  
            <div class="category-carousel" id="shopCategoryChips" style="margin-bottom:12px;"></div>  
            <div class="product-grid" id="shopProducts"></div>  
        </section>  

        <section class="page-section" id="page-blog">  
            <div class="section-header"><h3>📰 مقالات و آموزش</h3><a href="javascript:void(0)" onclick="showPage('home')"><i class="fa-solid fa-arrow-right"></i> بازگشت</a></div>  
            <div class="category-carousel" id="blogCategoryChips" style="margin-bottom:12px;"></div>
            <div id="blogGrid"></div>  
        </section>  

        <section class="page-section" id="page-cart">  
            <div class="section-header"><h3>🛒 سبد خرید</h3><a href="javascript:void(0)" onclick="showPage('shop')"><i class="fa-solid fa-arrow-right"></i> بازگشت</a></div>  
            <div id="cartContent"></div>  
        </section>  

        <section class="page-section" id="page-auth">  
            <div id="authContainer"></div>  
        </section>  

        <section class="page-section" id="page-user-dashboard">  
            <div id="userDashboardContent"></div>  
        </section>  

        <section class="page-section" id="page-admin">  
            <div id="adminTabContent"></div>  
        </section>  
    </main>  

    <nav class="bottom-nav" id="bottomNav">  
        <a href="javascript:void(0)" class="bottom-nav-item active" onclick="showPage('home')"><i class="fa-solid fa-house"></i><span>خانه</span></a>  
        <a href="javascript:void(0)" class="bottom-nav-item" onclick="showPage('shop')"><i class="fa-solid fa-store"></i><span>فروشگاه</span></a>  
        <a href="javascript:void(0)" class="bottom-nav-item" onclick="showPage('cart')"><i class="fa-solid fa-shopping-cart"></i><span>سبد</span><span class="badge" id="bottomCartBadge">0</span></a>  
        <a href="javascript:void(0)" class="bottom-nav-item" onclick="showPage('blog')"><i class="fa-solid fa-blog"></i><span>مقالات</span></a>  
        <a href="javascript:void(0)" class="bottom-nav-item" onclick="showPage('user-dashboard')"><i class="fa-solid fa-user"></i><span>حساب</span></a>  
    </nav>  

    <div class="admin-backdrop" id="adminBackdrop" onclick="toggleAdminSidebar()"></div>  
    <div class="admin-sidebar" id="adminSidebar">  
        <div class="admin-sidebar-header"><h3><i class="fa-solid fa-shield-halved"></i> مدیریت</h3><button class="close-btn" onclick="toggleAdminSidebar()"><i class="fa-solid fa-xmark"></i></button></div>  
        <a href="javascript:void(0)" onclick="showAdminTab('overview'); toggleAdminSidebar();"><i class="fa-solid fa-chart-pie"></i> نمای کلی</a>  
        <a href="javascript:void(0)" onclick="showAdminTab('products'); toggleAdminSidebar();"><i class="fa-solid fa-boxes"></i> محصولات</a>  
        <a href="javascript:void(0)" onclick="showAdminTab('orders'); toggleAdminSidebar();"><i class="fa-solid fa-truck"></i> سفارشات</a>  
        <a href="javascript:void(0)" onclick="showAdminTab('blog'); toggleAdminSidebar();"><i class="fa-solid fa-blog"></i> مقالات</a>  
        <a href="javascript:void(0)" onclick="showAdminTab('settings'); toggleAdminSidebar();"><i class="fa-solid fa-gear"></i> تنظیمات فروشگاه</a>  
        <a href="javascript:void(0)" onclick="if(confirm('خروج؟')){logout(); toggleAdminSidebar();}"><i class="fa-solid fa-right-from-bracket"></i> خروج</a>  
    </div>  

    <div id="modalContainer"></div>  

    <script>  
        const DEFAULT_CATEGORIES = [  
            { id: 'cat1', name: 'پرکاربرد', icon: '🌶️' }, { id: 'cat2', name: 'فلفل', icon: '️' },  
            { id: 'cat3', name: 'لیمو و دارچین', icon: '🍋' }, { id: 'cat4', name: 'سبزیجات', icon: '🌿' },  
            { id: 'cat5', name: 'دانه‌ها', icon: '🌱' }, { id: 'cat6', name: 'چاشنی', icon: '🥣' },  
        ];  

        const DEFAULT_PRODUCTS = [  
            { id: 'p1', name: 'زردچوبه هندی', category: 'cat1', icon: '🌶️', fullDescription: 'زردچوبه هندی اصل با رنگ و عطر فوق‌العاده، بدون هیچ‌گونه ناخالصی.', uses: 'ضد التهاب قوی\nبهبود هضم غذا\nتقویت سیستم ایمنی\nرنگ‌دهی عالی به غذا', image: '', discount: 0, weights: [{ id: 'w1', label: '100 گرمی', price: 5000 }, { id: 'w2', label: '250 گرمی', price: 11000 }] },  
            { id: 'p2', name: 'زعفران نگین', category: 'cat5', icon: '🌱', fullDescription: 'زعفران سوپر نگین قائنات، عطر و طعم بی‌نظیر.', uses: 'شادی‌آور و ضد افسردگی\nتقویت حافظه\nبهبود سلامت قلب\nضد سرطان', image: '', discount: 0, weights: [{ id: 'w1', label: '1 گرمی', price: 12000 }, { id: 'w2', label: '5 گرمی', price: 55000 }] },  
        ];  

        const DEFAULT_BLOGS = [  
            { id: 'b1', title: 'رازهای یک قورمه‌سبزی جاافتاده', excerpt: 'با این ادویه‌ها قورمه‌سبزی شما رستورانی می‌شود...', content: 'استفاده از ادویه خورشتی مخصوص و لیمو عمانی...', category: 'غذاهای خوشمزه', date: Date.now() },  
            { id: 'b2', title: 'خواص شگفت‌انگیز زردچوبه', excerpt: 'زردچوبه فقط ادویه نیست، یک داروخانه است!', content: 'کورکومین موجود در زردچوبه خاصیت ضدالتهابی قوی دارد...', category: 'سلامت و خواص', date: Date.now() - 86400000 },  
        ];  

        let state = {  
            users: [], currentUser: null, products: [], categories: [], orders: [], cart: [], blogs: [], discounts: [],  
            announcement: { text: '🌟 ارسال رایگان برای خریدهای بالای ۵۰۰ هزار تومان 🌟', active: true },  
            settings: { shippingCost: 35000, vatPercent: 9, storeCardNumber: '6037991122334455', storeCardName: 'فروشگاه ادویه سرا' },
            activePage: 'home', shopFilter: 'all', blogFilter: 'all', userTab: 'profile', adminTab: 'overview', selectedWeight: {},  
        };  

        function saveState() { try { localStorage.setItem('spiceShop_v4', JSON.stringify(state)); } catch(e) {} }  
        function loadState() {  
            try {  
                const saved = localStorage.getItem('spiceShop_v4');  
                if (saved) {  
                    const parsed = JSON.parse(saved);  
                    state = { ...state, ...parsed };  
                    if (!state.settings) state.settings = { shippingCost: 35000, vatPercent: 9, storeCardNumber: '', storeCardName: '' };
                    if (!state.users.find(u => u.role === 'admin')) {  
                        state.users.push({ id: 'u_admin', name: 'مدیر', phone: '09120000000', password: 'admin123', role: 'admin', addresses: [], createdAt: Date.now() });  
                    }  
                } else { initDefaultState(); }  
            } catch(e) { initDefaultState(); }  
            saveState();  
        }  
        function initDefaultState() {  
            state.users = [{ id: 'u_admin', name: 'مدیر', phone: '09120000000', password: 'admin123', role: 'admin', addresses: [], createdAt: Date.now() }];  
            state.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));  
            state.products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));  
            state.blogs = JSON.parse(JSON.stringify(DEFAULT_BLOGS));  
            saveState();  
        }  

        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2,5); }  
        function formatPrice(p) { return (p || 0).toLocaleString('fa-IR'); }  
        function showToast(msg, type='info') {  
            const c = document.getElementById('toastContainer'); if (!c) return;  
            const t = document.createElement('div'); t.className = `toast ${type}`; t.textContent = msg;  
            c.appendChild(t); setTimeout(() => t.remove(), 3000);  
        }  
        function getCategoryName(id) { const c = state.categories.find(x => x.id === id); return c ? c.name : 'نامشخص'; }  
        function getProductById(id) { return state.products.find(p => p.id === id); }  
        function getWeightPrice(product, weightId) { const w = product.weights.find(x => x.id === weightId); return w ? w.price : 0; }  
        function getEffectivePrice(product, weightId) {  
            const base = getWeightPrice(product, weightId);  
            return product.discount > 0 ? Math.round(base * (1 - product.discount/100)) : base;  
        }  

        function applyLayoutMode() {
            if (state.currentUser && state.currentUser.role === 'admin') document.body.classList.add('admin-mode');
            else document.body.classList.remove('admin-mode');
        }

        function showPage(page) {  
            state.activePage = page;  
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));  
            const el = document.getElementById(`page-${page}`); if (el) el.classList.add('active');  
            
            if (!state.currentUser || state.currentUser.role !== 'admin') {
                document.querySelectorAll('.bottom-nav-item').forEach(b => b.classList.remove('active'));  
                const navMap = { home: 0, shop: 1, cart: 2, blog: 3, 'user-dashboard': 4 };  
                if (navMap[page] !== undefined) {  
                    const items = document.querySelectorAll('.bottom-nav-item');  
                    if (items[navMap[page]]) items[navMap[page]].classList.add('active');  
                }  
            }

            if (page === 'home') renderHome();  
            else if (page === 'shop') renderShop();  
            else if (page === 'blog') renderBlog();  
            else if (page === 'cart') renderCart();  
            else if (page === 'auth') renderAuthForm();  
            else if (page === 'user-dashboard') renderUserDashboard();  
            else if (page === 'admin') renderAdminDashboard();  

            updateCartBadge(); applyLayoutMode(); saveState();  
        }  

        function updateCartBadge() {  
            const count = state.cart.reduce((s, i) => s + (i.quantity || 0), 0);  
            const badge = document.getElementById('bottomCartBadge');  
            if (badge) { badge.style.display = count > 0 ? 'flex' : 'none'; badge.textContent = count; }  
        }  

        function handleGlobalSearch(query) {  
            if (!query || query.length < 2) return;  
            showPage('shop'); state.shopFilter = 'all'; renderShop(query.toLowerCase());  
        }  

        function toggleAdminSidebar() {  
            document.getElementById('adminSidebar').classList.toggle('open');  
            document.getElementById('adminBackdrop').classList.toggle('show');  
        }  

        function renderHome() {  
            const annBar = document.getElementById('announcementBanner');  
            if (annBar) {
                if (state.announcement?.active) { annBar.style.display = 'block'; document.getElementById('announcementText').textContent = state.announcement.text; }  
                else annBar.style.display = 'none';  
            }
            const catContainer = document.getElementById('homeCategoryChips');
            if (catContainer) catContainer.innerHTML = state.categories.map(c => `<div class="cat-item" onclick="showPage('shop'); filterProducts('${c.id}')"><span>${c.icon}</span><small>${c.name}</small></div>`).join('');  
            const featuredContainer = document.getElementById('homeFeaturedProducts');
            if (featuredContainer) featuredContainer.innerHTML = state.products.slice(0, 6).map(p => createProductCardHTML(p)).join('');  
        }  

        function createProductCardHTML(product) {  
            if (!product || !product.weights) return '';
            const w = product.weights[0];
            const effPrice = getEffectivePrice(product, w.id);  
            return `<div class="product-card" onclick="showProductDetail('${product.id}')">  
                <div class="product-image">${product.image ? `<img src="${product.image}">` : `<span>${product.icon}</span>`}</div>  
                <div class="product-body">  
                    <div class="product-name">${product.name}</div>  
                    <div class="product-price">${formatPrice(effPrice)} <small>تومان</small></div>  
                    <button class="add-to-cart-btn" onclick="event.stopPropagation(); addToCart('${product.id}', '${w.id}')"><i class="fa-solid fa-cart-plus"></i> افزودن</button>  
                </div>  
            </div>`;  
        }  

        // ===== PRODUCT DETAIL MODAL (Article Style) =====
        function showProductDetail(productId) {  
            const product = getProductById(productId);  
            if (!product) return;  
            const w = product.weights[0];
            const effPrice = getEffectivePrice(product, w.id);
            const usesArray = product.uses ? product.uses.split('\n').filter(u => u.trim() !== '') : [];
            
            document.getElementById('modalContainer').innerHTML = `  
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">  
                <div class="modal">  
                    <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>  
                    <div class="detail-hero">${product.image ? `<img src="${product.image}">` : `<span>${product.icon}</span>`}</div>  
                    <h2 style="margin-bottom:4px;">${product.name}</h2>  
                    <span style="font-size:0.85rem;color:var(--text-light);margin-bottom:16px;display:block;">دسته: ${getCategoryName(product.category)}</span>  
                    
                    <div class="detail-section">  
                        <h4><i class="fa-solid fa-circle-info"></i> توضیحات محصول</h4>  
                        <p>${product.fullDescription || 'توضیحات خاصی ثبت نشده است.'}</p>  
                    </div>  
                    
                    ${usesArray.length > 0 ? `
                    <div class="detail-section">  
                        <h4><i class="fa-solid fa-heart-pulse"></i> کاربردها و خواص</h4>  
                        <ul class="uses-list">${usesArray.map(u => `<li><i class="fa-solid fa-check"></i> ${u}</li>`).join('')}</ul>  
                    </div>` : ''}

                    <div class="detail-section" style="background:var(--cream); padding:16px; border-radius:var(--radius-sm); text-align:center;">  
                        <div style="font-size:1.3rem;font-weight:800;color:var(--accent);margin-bottom:12px;">${formatPrice(effPrice)} تومان <small style="font-size:0.8rem;color:var(--text-light)">(${w.label})</small></div>  
                        <button class="btn btn-primary btn-block" onclick="addToCart('${product.id}', '${w.id}'); closeModal();">  
                            <i class="fa-solid fa-cart-plus"></i> افزودن به سبد خرید  
                        </button>  
                    </div>  
                </div>  
            </div>`;  
        }  
        function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }  

        function renderShop(searchQuery = '') {  
            const catChips = document.getElementById('shopCategoryChips');  
            if (catChips) {
                catChips.innerHTML = `<div class="cat-item" onclick="filterProducts('all')" style="${state.shopFilter === 'all' ? 'background:var(--accent);color:#fff;' : ''}"><span>🛍️</span><small>همه</small></div>` +  
                state.categories.map(c => `<div class="cat-item" onclick="filterProducts('${c.id}')" style="${state.shopFilter === c.id ? 'background:var(--accent);color:#fff;' : ''}"><span>${c.icon}</span><small>${c.name}</small></div>`).join('');  
            }
            let filtered = state.shopFilter === 'all' ? state.products : state.products.filter(p => p.category === state.shopFilter);  
            if (searchQuery) filtered = filtered.filter(p => (p.name || '').toLowerCase().includes(searchQuery));  
            const productsContainer = document.getElementById('shopProducts');
            if (productsContainer) productsContainer.innerHTML = filtered.length > 0 ? filtered.map(p => createProductCardHTML(p)).join('') : '<div class="empty-state"><i class="fa-solid fa-search"></i><p>محصولی یافت نشد</p></div>';  
        }  
        function filterProducts(categoryId) { state.shopFilter = categoryId; renderShop(); }  

        function addToCart(productId, weightId) {  
            const product = getProductById(productId); if (!product) return;  
            const existing = state.cart.find(item => item.productId === productId && item.weightId === weightId);  
            if (existing) existing.quantity += 1; else state.cart.push({ productId, weightId, quantity: 1 });  
            saveState(); updateCartBadge(); showToast('به سبد اضافه شد', 'success');  
            if (state.activePage === 'cart') renderCart();  
        }  

        function renderCart() {  
            const container = document.getElementById('cartContent'); if (!container) return;
            if (state.cart.length === 0) {  
                container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-shopping-cart"></i><p>سبد خالی است</p><button class="btn btn-primary btn-sm" onclick="showPage('shop')">رفتن به فروشگاه</button></div>`;  
                return;  
            }  
            let subtotal = 0;  
            const itemsHTML = state.cart.map(item => {  
                const product = getProductById(item.productId); if (!product) return '';  
                const price = getEffectivePrice(product, item.weightId);  
                subtotal += price * item.quantity;  
                return `<div style="background:#fff;border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:10px;">  
                    <div style="font-size:1.5rem;">${product.icon}</div>  
                    <div style="flex:1;"><div style="font-weight:700;">${product.name}</div><div style="font-size:0.8rem;color:var(--text-light);">${price.toLocaleString('fa-IR')} تومان</div></div>  
                    <div style="font-weight:700;">${item.quantity} عدد</div>  
                    <button class="btn btn-danger btn-sm" onclick="removeFromCart('${product.id}', '${item.weightId}')"><i class="fa-solid fa-trash"></i></button>  
                </div>`;  
            }).join('');  
            
            container.innerHTML = `${itemsHTML}  
                <div style="background:#fff;border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow-sm);">  
                    <button class="btn btn-primary btn-block" onclick="showCheckoutModal()">تسویه حساب و پرداخت</button>  
                </div>`;  
        }  
        function removeFromCart(productId, weightId) {  
            state.cart = state.cart.filter(i => !(i.productId === productId && i.weightId === weightId));  
            saveState(); updateCartBadge(); renderCart();  
        }  

        // ===== CHECKOUT & PAYMENT MODAL =====
        function showCheckoutModal() {
            if (!state.currentUser) { showToast('لطفاً ابتدا وارد حساب کاربری شوید', 'error'); showPage('auth'); return; }
            if (!state.currentUser.addresses || state.currentUser.addresses.length === 0) { showToast('لطفاً ابتدا یک آدرس ثبت کنید', 'error'); showPage('user-dashboard'); setTimeout(()=>showUserTab('addresses'), 100); return; }

            let subtotal = state.cart.reduce((sum, item) => { const p = getProductById(item.productId); return sum + (p ? getEffectivePrice(p, item.weightId) * item.quantity : 0); }, 0);
            const shipping = state.settings.shippingCost || 0;
            const vat = Math.round((subtotal * (state.settings.vatPercent || 0)) / 100);
            const total = subtotal + shipping + vat;

            document.getElementById('modalContainer').innerHTML = `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal" style="max-width:550px;">
                    <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                    <h3 style="margin-bottom:16px;">تسویه حساب</h3>
                    
                    <div class="checkout-summary">
                        <div class="checkout-row"><span>جمع سبد خرید:</span><span>${formatPrice(subtotal)} تومان</span></div>
                        <div class="checkout-row"><span>هزینه ارسال:</span><span>${formatPrice(shipping)} تومان</span></div>
                        <div class="checkout-row"><span>مالیات بر ارزش افزوده (${state.settings.vatPercent}%):</span><span>${formatPrice(vat)} تومان</span></div>
                        <div class="checkout-row total"><span>مبلغ قابل پرداخت:</span><span>${formatPrice(total)} تومان</span></div>
                    </div>

                    <div style="margin-bottom:16px;">
                        <label style="font-size:0.9rem;font-weight:700;display:block;margin-bottom:8px;">روش پرداخت:</label>
                        <select id="paymentMethod" onchange="togglePaymentFields()" style="width:100%;">
                            <option value="offline">کارت به کارت (آفلاین)</option>
                            <option value="online">درگاه پرداخت آنلاین (زرین‌پال/بانک)</option>
                        </select>
                    </div>

                    <div id="offlineFields">
                        <div class="bank-card-preview" id="storeCardPreview">
                            <div class="chip"></div>
                            <div class="bank-name" id="storeBankName"><i class="fa-solid fa-building-columns"></i> ${detectBank(state.settings.storeCardNumber).name}</div>
                            <div class="card-number" id="storeCardNumDisplay">${formatCardNumber(state.settings.storeCardNumber)}</div>
                            <div class="card-holder">${state.settings.storeCardName || 'نام صاحب حساب'}</div>
                        </div>
                        <button class="btn btn-secondary btn-sm btn-block" onclick="copyToClipboard('${state.settings.storeCardNumber}')" style="margin-bottom:16px;"><i class="fa-regular fa-copy"></i> کپی شماره کارت</button>

                        <label style="font-size:0.85rem;font-weight:700;">شماره کارت شما (جهت بررسی):</label>
                        <input type="text" id="userCardNumber" placeholder="مثال: 6037991122334455" maxlength="19" oninput="formatAndDetectCard(this)" style="margin-bottom:12px; direction:ltr; text-align:left;">
                        
                        <div id="userCardPreview" style="display:none;" class="bank-card-preview">
                            <div class="chip"></div>
                            <div class="bank-name" id="userBankName"><i class="fa-solid fa-building-columns"></i> نامشخص</div>
                            <div class="card-number" id="userCardNumDisplay">---- ---- ---- ----</div>
                            <div class="card-holder">کارت شما</div>
                        </div>

                        <label style="font-size:0.85rem;font-weight:700;margin-top:12px;display:block;">ارسال فیش واریزی:</label>
                        <select id="receiptType" onchange="toggleReceiptType()" style="margin-bottom:8px;">
                            <option value="text">توضیحات متنی (شماره پیگیری)</option>
                            <option value="image">آپلود تصویر فیش (شبیه‌سازی)</option>
                        </select>
                        <textarea id="receiptText" placeholder="شماره پیگیری تراکنش و بانک مبدا را بنویسید..." style="margin-bottom:12px;"></textarea>
                        <input type="file" id="receiptImage" accept="image/*" style="display:none;margin-bottom:12px;">
                    </div>

                    <div id="onlineFields" style="display:none; text-align:center; padding:20px; background:var(--cream); border-radius:var(--radius-sm); margin-bottom:16px;">
                        <i class="fa-solid fa-shield-halved" style="font-size:3rem; color:var(--green); margin-bottom:10px;"></i>
                        <p style="font-size:0.9rem;">انتقال به درگاه امن بانکی / زرین‌پال</p>
                        <p style="font-size:0.8rem; color:var(--text-light);">(در نسخه آزمایشی، پرداخت آنلاین شبیه‌سازی می‌شود)</p>
                    </div>

                    <button class="btn btn-primary btn-block" onclick="processOrder(${total})">
                        <i class="fa-solid fa-check-circle"></i> ثبت نهایی سفارش
                    </button>
                </div>
            </div>`;
        }

        function togglePaymentFields() {
            const method = document.getElementById('paymentMethod').value;
            document.getElementById('offlineFields').style.display = method === 'offline' ? 'block' : 'none';
            document.getElementById('onlineFields').style.display = method === 'online' ? 'block' : 'none';
        }

        function toggleReceiptType() {
            const type = document.getElementById('receiptType').value;
            document.getElementById('receiptText').style.display = type === 'text' ? 'block' : 'none';
            document.getElementById('receiptImage').style.display = type === 'image' ? 'block' : 'none';
        }

        function detectBank(cardNumber) {
            if (!cardNumber || cardNumber.length < 6) return { name: 'نامشخص', color: '#7f8c8d' };
            const cleanNum = cardNumber.replace(/\s/g, '');
            const bin = cleanNum.substring(0, 6);
            if (bin.startsWith('603799') || bin.startsWith('603770')) return { name: 'بانک ملی ایران', color: 'linear-gradient(135deg, #004b87 0%, #002a4d 100%)' };
            if (bin.startsWith('610433')) return { name: 'بانک ملت', color: 'linear-gradient(135deg, #004b87 0%, #0066cc 100%)' };
            if (bin.startsWith('589210')) return { name: 'بانک سپه', color: 'linear-gradient(135deg, #005b4f 0%, #003d35 100%)' };
            if (bin.startsWith('627648')) return { name: 'بانک توسعه تعاون', color: 'linear-gradient(135deg, #3b5998 0%, #2a4070 100%)' };
            if (bin.startsWith('627381')) return { name: 'بانک انصار', color: 'linear-gradient(135deg, #8e44ad 0%, #6c3483 100%)' };
            if (bin.startsWith('627760')) return { name: 'بانک پاسارگاد', color: 'linear-gradient(135deg, #2c3e50 0%, #1a252f 100%)' };
            if (bin.startsWith('502229') || bin.startsWith('627412')) return { name: 'بانک اقتصاد نوین', color: 'linear-gradient(135deg, #e67e22 0%, #d35400 100%)' };
            if (bin.startsWith('627961')) return { name: 'بانک صنعت و معدن', color: 'linear-gradient(135deg, #2c3e50 0%, #1a252f 100%)' };
            if (bin.startsWith('504172')) return { name: 'بانک رسالت', color: 'linear-gradient(135deg, #2980b9 0%, #1f618d 100%)' };
            if (bin.startsWith('502806')) return { name: 'بانک شهر', color: 'linear-gradient(135deg, #f39c12 0%, #d68910 100%)' };
            return { name: 'سایر بانک‌ها', color: 'linear-gradient(135deg, #7f8c8d 0%, #566573 100%)' };
        }

        function formatCardNumber(num) {
            return num.replace(/\s/g, '').replace(/(\d{4})/g, '$1 ').trim();
        }

        function formatAndDetectCard(input) {
            let val = input.value.replace(/\D/g, '').substring(0, 16);
            input.value = formatCardNumber(val);
            
            const preview = document.getElementById('userCardPreview');
            if (val.length >= 6) {
                preview.style.display = 'block';
                const bank = detectBank(val);
                document.getElementById('userCardPreview').style.background = bank.color;
                document.getElementById('userBankName').innerHTML = `<i class="fa-solid fa-building-columns"></i> ${bank.name}`;
                document.getElementById('userCardNumDisplay').textContent = formatCardNumber(val);
            } else {
                preview.style.display = 'none';
            }
        }

        function copyToClipboard(text) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => showToast('شماره کارت کپی شد', 'success'));
        }

        function processOrder(total) {
            const method = document.getElementById('paymentMethod').value;
            let receiptInfo = '';
            
            if (method === 'offline') {
                const userCard = document.getElementById('userCardNumber').value;
                if (userCard.replace(/\s/g, '').length < 16) { showToast('لطفاً شماره کارت خود را کامل وارد کنید', 'error'); return; }
                
                const rType = document.getElementById('receiptType').value;
                if (rType === 'text') {
                    receiptInfo = document.getElementById('receiptText').value;
                    if (!receiptInfo) { showToast('لطفاً شماره پیگیری را وارد کنید', 'error'); return; }
                } else {
                    const file = document.getElementById('receiptImage').files[0];
                    if (!file) { showToast('لطفاً تصویر فیش را انتخاب کنید', 'error'); return; }
                    receiptInfo = 'تصویر فیش ارسال شد (شبیه‌سازی)';
                }
                receiptInfo = `کارت مبدا: ${userCard} | ${receiptInfo}`;
            } else {
                receiptInfo = 'پرداخت آنلاین (در انتظار تایید درگاه)';
            }

            const order = { 
                id: generateId(), 
                userId: state.currentUser.id, 
                userName: state.currentUser.name,
                userPhone: state.currentUser.phone,
                userAddress: state.currentUser.addresses[0].fullAddress + '، ' + state.currentUser.addresses[0].city,
                items: JSON.parse(JSON.stringify(state.cart)), 
                subtotal: state.cart.reduce((sum, item) => { const p = getProductById(item.productId); return sum + (p ? getEffectivePrice(p, item.weightId) * item.quantity : 0); }, 0),
                shipping: state.settings.shippingCost || 0,
                vat: Math.round((state.cart.reduce((sum, item) => { const p = getProductById(item.productId); return sum + (p ? getEffectivePrice(p, item.weightId) * item.quantity : 0); }, 0) * (state.settings.vatPercent || 0)) / 100),
                total: total,
                paymentMethod: method,
                receiptInfo: receiptInfo,
                status: method === 'online' ? 'paid' : 'pending_payment', 
                trackingCode: '',
                createdAt: Date.now() 
            };  
            
            state.orders.push(order);  
            state.cart = [];  
            saveState(); updateCartBadge(); closeModal();  
            showToast('سفارش شما با موفقیت ثبت شد 🎉', 'success');  
            showPage('user-dashboard');  
        }

        // ===== BLOG WITH CATEGORIES =====
        function renderBlog() {
            const catChips = document.getElementById('blogCategoryChips');
            const blogGrid = document.getElementById('blogGrid');
            if (!catChips || !blogGrid) return;

            const categories = ['همه', ...new Set(state.blogs.map(b => b.category).filter(Boolean))];
            catChips.innerHTML = categories.map(c => 
                `<div class="cat-item" onclick="filterBlog('${c}')" style="${state.blogFilter === c ? 'background:var(--accent);color:#fff;' : ''}">
                    <span>📰</span><small>${c}</small>
                </div>`
            ).join('');

            const filtered = state.blogFilter === 'همه' ? state.blogs : state.blogs.filter(b => b.category === state.blogFilter);
            blogGrid.innerHTML = filtered.length > 0 ? filtered.map(b => `
                <div class="blog-card" onclick="showBlogDetail('${b.id}')">  
                    <div class="blog-image">${b.image ? `<img src="${b.image}">` : '📰'}</div>  
                    <div class="blog-body">  
                        <span class="blog-category-tag">${b.category || 'عمومی'}</span>
                        <div class="blog-title">${b.title}</div>  
                        <div class="blog-excerpt">${b.excerpt}</div>  
                    </div>  
                </div>
            `).join('') : '<div class="empty-state"><p>مقاله‌ای در این دسته‌بندی یافت نشد</p></div>';
        }
        function filterBlog(cat) { state.blogFilter = cat; renderBlog(); }

        function showBlogDetail(blogId) {  
            const blog = state.blogs.find(b => b.id === blogId); if (!blog) return;  
            document.getElementById('modalContainer').innerHTML = `  
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">  
                <div class="modal">

                    </div>  
                </div>  
            </div>`;  
        }  

        function showRegisterForm() {  
            const container = document.getElementById('authContainer'); if (!container) return;
            container.innerHTML = `  
            <div class="modal-overlay" style="position:relative;background:transparent;">  
                <div class="modal" style="max-width:400px;">  
                    <h3 style="text-align:center;margin-bottom:20px;">ثبت‌نام</h3>  
                    <form onsubmit="register(event)">  
                        <div style="margin-bottom:10px;"><input type="text" id="regName" placeholder="نام و نام خانوادگی" required></div>  
                        <div style="margin-bottom:10px;"><input type="tel" id="regPhone" placeholder="شماره موبایل (مثال: 0912...)" required></div>  
                        <div style="margin-bottom:16px;"><input type="password" id="regPassword" placeholder="رمز عبور (حداقل 6 رقم)" minlength="6" required></div>  
                        <button type="submit" class="btn btn-primary btn-block">ثبت‌نام</button>

                    <button class="btn btn-secondary btn-block" style="margin-top:12px;" onclick="renderAuthForm()">بازگشت به ورود</button>
                </div>  
            </div>`;

        function register(e) {   
            e.preventDefault();   
            const name = document.getElementById('regName').value.trim();   
            const phone = document.getElementById('regPhone').value.trim();   
            const password = document.getElementById('regPassword').value;  
            if (state.users.find(u => u.phone === phone)) { showToast('این شماره قبلاً ثبت شده است', 'error'); return; }  
            const user = { id: generateId(), name, phone, password, role: 'user', addresses: [], createdAt: Date.now() };  
            state.users.push(user); state.currentUser = user; saveState(); showToast('ثبت‌نام موفقیت‌آمیز بود 🎉', 'success'); showPage('user-dashboard');  
        }  

        function login(e) {   
            e.preventDefault();   
            const phone = document.getElementById('loginPhone').value.trim();   
            const pass = document.getElementById('loginPassword').value;  
            const user = state.users.find(u => u.phone === phone && u.password === pass);  
            if (!user) { showToast('شماره موبایل یا رمز عبور اشتباه است', 'error'); return; }  
            state.currentUser = user; saveState(); showToast(`خوش آمدید ${user.name}`, 'success');  
            if (user.role === 'admin') showPage('admin'); else showPage('user-dashboard');  
        }  

        function logout() { state.currentUser = null; saveState(); showToast('خروج موفقیت‌آمیز', 'info'); showPage('home'); }  

        // ===== USER DASHBOARD =====

            if (!state.currentUser) { showPage('auth'); return; }  
            const container = document.getElementById('userDashboardContent'); if (!container) return;

        function deleteAddress(id) { const u = state.currentUser; u.addresses = u.addresses.filter(a => a.id !== id); saveState(); renderUserDashboard(); }

            showAdminTab(state.adminTab || 'overview');

        }

            e.preventDefault();
            state.settings.shippingCost = parseInt(document.getElementById('setShipping').value) || 0;

                <form onsubmit="addBlog(event)">
                    <input type="text" id="blogTitle" placeholder="عنوان مقاله" required>
                    <input type="text" id="blogCategory" placeholder="دسته‌بندی (مثال: غذاهای خوشمزه)" required style="margin-top:8px;">
                    <input type="text" id="blogExcerpt" placeholder="خلاصه کوتاه" required style="margin-top:8px;">
                    <textarea id="blogContent" placeholder="محتوای کامل مقاله..." required style="margin-top:8px;min-height:150px;"></textarea>
                    <button class="btn btn-primary btn-sm" style="margin-top:12px;width:100%;">انتشار مقاله</button>
                </form></div>`;
        }
        function addBlog(e) {
            e.preventDefault();
            state.blogs.push({ id: generateId(), title: document.getElementById('blogTitle').value, category: document.getElementById('blogCategory').value, excerpt: document.getElementById('blogExcerpt').value, content: document.getElementById('blogContent').value, date: Date.now() });
            saveState(); showToast('مقاله منتشر شد', 'success'); showAdminTab('blog');
        }
        function deleteBlog(id) { if(confirm('حذف شود؟')) { state.blogs = state.blogs.filter(b => b.id !== id); saveState(); showAdminTab('blog'); } }

        function init() {  
            loadState(); applyLayoutMode();
            if (state.currentUser && state.currentUser.role === 'admin') showPage('admin');
            else if (state.currentUser) showPage('user-dashboard');
            else { renderHome(); updateCartBadge(); }
        }  
        init();  
    </script>
</body>  
              </html>
