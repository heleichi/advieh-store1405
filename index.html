<!DOCTYPE html>
<html lang="fa" dir="rtl">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>🌶️ طعم‌یار | فروشگاه ادویه</title>  
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">  
    <style>  
        :root {  
            --bg: #f7f5f2; --text: #1a1815; --text-light: #6b6560;  
            --accent: #c0392b; --accent-hover: #a93226; --secondary: #8B4513;  
            --gold: #D4A017; --green: #27ae60; --cream: #f5ede3; --border: #e8ddd0;  
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04); --shadow-md: 0 4px 16px rgba(0,0,0,0.08);  
            --radius: 14px; --radius-sm: 10px; --radius-lg: 22px;  
            --font: 'Vazirmatn', sans-serif; --bottom-nav-height: 64px;  
        }  
        * { margin: 0; padding: 0; box-sizing: border-box; }  
        body {  
            font-family: var(--font); background: var(--bg); color: var(--text);  
            line-height: 1.7; min-height: 100vh; overflow-x: hidden;  
            padding-bottom: var(--bottom-nav-height);  
        }  
        body.admin-mode { padding-bottom: 0; background: #f0f0f0; }
        body.admin-mode .top-header, body.admin-mode .bottom-nav { display: none; }

        a { text-decoration: none; color: inherit; }  
        button { cursor: pointer; font-family: var(--font); border: none; outline: none; transition: 0.2s; background: none; }  
        input, select, textarea {  
            font-family: var(--font); outline: none; border: 1.5px solid var(--border);  
            border-radius: var(--radius-sm); padding: 10px 14px; font-size: 0.95rem;  
            transition: 0.2s; background: #fff; width: 100%;  
        }  
        input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(192,57,43,0.08); }  

        .container { max-width: 600px; margin: 0 auto; padding: 0 12px; }  
        body.admin-mode .container { max-width: 100%; padding: 0 16px; }

        .page-section { display: none; animation: fadeIn 0.3s ease-in-out; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .top-header {  
            background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000;  
            padding: 8px 12px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow-sm); height: 60px;  
        }  
        .top-header .logo { font-size: 1.4rem; font-weight: 900; color: var(--accent); display: flex; align-items: center; gap: 6px; }  
        .top-header .search-box { flex: 1; background: var(--cream); border-radius: 50px; padding: 6px 12px; display: flex; align-items: center; gap: 8px; }  
        .top-header .search-box input { border: none; background: transparent; padding: 4px 0; font-size: 0.9rem; width: 100%; }  

        .header-logout-btn {
            background: var(--accent); color: #fff; padding: 6px 12px;
            border-radius: 20px; font-size: 0.8rem; font-weight: 600;
            display: none; align-items: center; gap: 4px;
        }
        .header-logout-btn.visible { display: flex; }

        .bottom-nav {  
            position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border);  
            display: flex; justify-content: space-around; align-items: center; height: var(--bottom-nav-height); z-index: 1000;  
            box-shadow: 0 -2px 12px rgba(0,0,0,0.06);  
        }  
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.7rem; color: var(--text-light); padding: 4px 8px; border-radius: 12px; min-width: 56px; cursor: pointer; position: relative; }  
        .bottom-nav-item i { font-size: 1.3rem; }  
        .bottom-nav-item.active { color: var(--accent); background: rgba(192,57,43,0.06); }  
        .bottom-nav-item .badge { position: absolute; top: 2px; right: 12px; background: var(--accent); color: #fff; font-size: 0.65rem; width: 16px; height: 16px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: 700; }  

        .admin-top-bar { display: none; background: linear-gradient(135deg, #1f140e 0%, #3a2417 100%); color: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 1000; align-items: center; gap: 12px; }
        body.admin-mode .admin-top-bar { display: flex; }
        .admin-top-bar .admin-logo { font-size: 1.1rem; font-weight: 800; color: var(--gold); flex: 1; }
        .admin-top-bar-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 12px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }

        .admin-sidebar { position: fixed; top: 0; right: -300px; width: 300px; height: 100%; background: #1f140e; color: #fff; z-index: 2000; transition: right 0.3s; padding: 16px; overflow-y: auto; }  
        .admin-sidebar.open { right: 0; }  
        .admin-sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }  
        .admin-sidebar-header h3 { color: var(--gold); }
        .admin-sidebar .close-btn { color: #aaa; font-size: 1.4rem; }
        .admin-sidebar a { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--radius-sm); color: #ddd; margin-bottom: 4px; cursor: pointer; }  
        .admin-sidebar a:hover { background: rgba(255,255,255,0.1); color: #fff; }  
        .admin-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1500; display: none; }  
        .admin-backdrop.show { display: block; }  

        .home-hero-banner { background: linear-gradient(135deg, #3a2417, #6b3a1f); border-radius: var(--radius-lg); padding: 20px 16px; margin: 16px 0; color: #fff; text-align: center; }  
        .section-header { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 12px; }  
        .section-header h3 { font-size: 1.1rem; font-weight: 800; }  
        .section-header a { font-size: 0.8rem; color: var(--accent); }  

        .category-carousel { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px; }  
        .category-carousel .cat-item { min-width: 80px; text-align: center; background: #fff; border-radius: var(--radius-sm); padding: 10px 6px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); cursor: pointer; }  
        .category-carousel .cat-item span { font-size: 1.8rem; display: block; }  
        .category-carousel .cat-item small { font-size: 0.7rem; color: var(--text-light); }  

        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }  
        .product-card { background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border); cursor: pointer; }  
        .product-image { height: 130px; background: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; position: relative; }  
        .product-body { padding: 10px 12px; }  
        .product-name { font-weight: 700; font-size: 0.9rem; }  
        .product-price { font-weight: 800; color: var(--accent); font-size: 0.95rem; }  
        .product-price .original { text-decoration: line-through; color: var(--text-light); font-size: 0.8rem; margin-left: 4px; }  
        .add-to-cart-btn { background: var(--accent); color: #fff; padding: 8px 12px; border-radius: 30px; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 8px; width: 100%; }  
        .add-to-cart-btn.added { background: var(--green); }  

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 16px; }  
        .modal { background: #fff; border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative; }  
        .modal-close { position: absolute; top: 16px; left: 16px; font-size: 1.3rem; color: var(--text-light); cursor: pointer; }  

        .toast-container { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 4000; display: flex; flex-direction: column; gap: 8px; }  
        .toast { padding: 10px 20px; border-radius: 30px; background: #333; color: #fff; font-size: 0.85rem; }  
        .toast.success { background: var(--green); } .toast.error { background: #e74c3c; }

        .btn { padding: 10px 18px; border-radius: 30px; font-weight: 700; font-size: 0.9rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }  
        .btn-primary { background: var(--accent); color: #fff; }  
        .btn-secondary { background: var(--cream); color: var(--text); } .btn-danger { background: #e74c3c; color: #fff; }  
        .btn-sm { padding: 6px 12px; font-size: 0.75rem; border-radius: 20px; } .btn-block { width: 100%; }  

        .login-box { background: #fff; border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-md); margin: 20px auto; max-width: 420px; }
        .login-box h3 { text-align: center; margin-bottom: 16px; color: var(--accent); }
        
        .credentials-box { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: var(--radius-lg); padding: 24px; margin: 20px 0; color: #fff; text-align: center; }
        .credentials-box h4 { margin-bottom: 16px; }
        .credential-item { background: rgba(255,255,255,0.2); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 12px; position: relative; }
        .credential-label { font-size: 0.85rem; opacity: 0.9; margin-bottom: 4px; }
        .credential-value { font-size: 1.3rem; font-weight: 800; font-family: monospace; }
        .copy-btn { position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.3); border: none; color: #fff; padding: 4px 8px; border-radius: 12px; cursor: pointer; font-size: 0.75rem; }

        .generate-btn { background: var(--green); color: #fff; padding: 12px 20px; border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 700; cursor: pointer; margin: 12px 0; width: 100%; }
        .generate-btn:disabled { background: #95a5a6; cursor: not-allowed; }

        .kitchen-hero { background: linear-gradient(135deg, #e67e22 0%, #d35400 100%); border-radius: var(--radius-lg); padding: 28px 20px; margin: 18px 0; color: #fff; text-align: center; }
        .kitchen-hero h2 { font-size: 1.6rem; font-weight: 900; margin-bottom: 8px; }

        .kitchen-shelves { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .kitchen-shelf { background: linear-gradient(135deg, #fff 0%, var(--cream) 100%); border-radius: var(--radius); padding: 18px 12px; text-align: center; cursor: pointer; border: 2px solid var(--border); }
        .kitchen-shelf.active { border-color: var(--accent); }
        .kitchen-shelf .shelf-icon { font-size: 2.5rem; }
        .kitchen-shelf .shelf-name { font-weight: 800; font-size: 0.95rem; }
        .kitchen-shelf .shelf-count { font-size: 0.75rem; color: var(--text-light); }

        .recipe-card { background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 14px; cursor: pointer; }
        .recipe-image { height: 160px; background: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 4rem; position: relative; }
        .recipe-category-badge { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.95); padding: 4px 10px; border-radius: 15px; font-size: 0.75rem; font-weight: 700; }
        .recipe-body { padding: 14px; }
        .recipe-title { font-weight: 800; font-size: 1.05rem; margin-bottom: 6px; }
        .recipe-desc { font-size: 0.88rem; color: var(--text-light); margin-bottom: 10px; line-height: 1.6; }
        .recipe-spices { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
        .spice-tag { background: var(--cream); color: var(--secondary); padding: 5px 10px; border-radius: 18px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
        .spice-tag:hover { background: var(--accent); color: #fff; }
        .recipe-meta { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--text-light); }

        .recipe-detail-section { margin-bottom: 18px; }
        .recipe-detail-section h4 { color: var(--secondary); font-size: 1.05rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .recipe-detail-section ul { list-style: none; }
        .recipe-detail-section ul li { padding: 7px 0; border-bottom: 1px dashed var(--border); display: flex; align-items: center; gap: 10px; }
        .recipe-detail-section ul li i { color: var(--green); }
        .recipe-detail-section ol { padding-right: 20px; }
        .recipe-detail-section ol li { padding: 9px 0; border-bottom: 1px dashed var(--border); line-height: 1.8; }

        .spice-uses-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .spice-use-card { background: var(--cream); padding: 12px; border-radius: var(--radius-sm); text-align: center; cursor: pointer; border: 2px solid transparent; }
        .spice-use-card:hover { border-color: var(--accent); }
        .spice-use-card i { font-size: 1.8rem; color: var(--accent); margin-bottom: 6px; }
        .spice-use-card h5 { font-size: 0.9rem; font-weight: 700; margin-bottom: 3px; }

        .recipe-spice-item { background: var(--cream); padding: 12px; border-radius: var(--radius-sm); display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .recipe-spice-item .spice-info { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; }

        .detail-hero { width: 100%; height: 200px; background: var(--cream); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 4rem; margin-bottom: 16px; }
        .detail-section { margin-bottom: 16px; }
        .detail-section h4 { color: var(--secondary); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .uses-list { list-style: none; }
        .uses-list li { padding: 6px 0; border-bottom: 1px dashed var(--border); display: flex; align-items: center; gap: 8px; }
        .uses-list li i { color: var(--green); }

        .product-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .product-tag { background: var(--cream); color: var(--secondary); padding: 4px 10px; border-radius: 15px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
        .product-tag:hover { background: var(--accent); color: #fff; }

        .checkout-summary { background: var(--cream); padding: 16px; border-radius: var(--radius-sm); margin: 16px 0; }
        .checkout-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .checkout-row.total { font-weight: 800; font-size: 1.1rem; color: var(--accent); border-top: 2px solid var(--border); padding-top: 8px; margin-top: 8px; }

        .credentials-display { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); border-radius: var(--radius-lg); padding: 20px; margin: 16px 0; color: #fff; }
        .credentials-display h4 { margin-bottom: 12px; }
        .cred-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.2); padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 8px; }
        .cred-row .label { font-size: 0.85rem; opacity: 0.9; }
        .cred-row .value { font-size: 1.1rem; font-weight: 800; font-family: monospace; }
        .cred-copy { background: rgba(255,255,255,0.3); border: none; color: #fff; padding: 6px 10px; border-radius: 12px; cursor: pointer; }

        .eitaa-warning { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); border-radius: var(--radius-lg); padding: 30px 20px; margin: 20px 0; color: #fff; text-align: center; }
        .eitaa-warning h2 { font-size: 1.5rem; margin-bottom: 16px; }
        .eitaa-warning .btn { background: #fff; color: #e74c3c; font-weight: 800; }
    </style>
</head>

        let state = {  
            users: [], currentUser: null, products: [], categories: [], orders: [], messages: [], cart: [],

        function saveState() { try { localStorage.setItem('tamYar_v6', JSON.stringify(state)); } catch(e) {} }  
        function loadState() {  
            try {  
                const saved = localStorage.getItem('tamYar_v6');  
                if (saved) {  
                    const parsed = JSON.parse(saved);  
                    state = { ...state, ...parsed };  
                    if (!state.welcomeCard) state.welcomeCard = { title: '🎉 به طعم‌یار خوش آمدید!', text: 'اولین خرید شما با تخفیف ویژه!', discountCode: 'WELCOME15', discountPercent: 15, active: true };
                    if (!state.settings) state.settings = { shippingCost: 35000, vatPercent: 9, storeCardNumber: '', storeCardName: '', adminChatId: EITAA_CHANNEL_ID };
                    if (!state.settings.adminChatId) state.settings.adminChatId = EITAA_CHANNEL_ID;
                    if (!Array.isArray(state.users)) state.users = [];  
                    if (!Array.isArray(state.products) || state.products.length === 0) state.products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));  
                    if (!Array.isArray(state.recipes) || state.recipes.length === 0) state.recipes = ALL_RECIPES;
                    if (!Array.isArray(state.orders)) state.orders = [];  
                    if (!Array.isArray(state.messages)) state.messages = [];  
                    if (!Array.isArray(state.cart)) state.cart = [];  
                    if (!Array.isArray(state.discounts)) state.discounts = [];  
                } else { initDefaultState(); }  
            } catch(e) { initDefaultState(); }  
            if (!state.users.find(u => u.role === 'admin')) {  
                state.users.push({ id: 'admin_local', userId: 0, name: 'مدیر', phone: '09120000000', role: 'admin', address: '', postalCode: '', city: '', firstPurchaseDone: true, createdAt: Date.now() });  
            }  
            saveState();  
        }  
        function initDefaultState() {  
            state.users = [{ id: 'admin_local', userId: 0, name: 'مدیر', phone: '09120000000', role: 'admin', address: '', postalCode: '', city: '', firstPurchaseDone: true, createdAt: Date.now() }];  
            state.products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));  
            state.recipes = ALL_RECIPES;
            state.orders = []; state.messages = []; state.cart = []; state.discounts = [];  
            saveState();  
        }  

        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2,5); }  
        function generateUserCode(userId) { return `TY-${userId}`; }
        function generatePassword() { return Math.random().toString(36).substr(2, 8); }
        function formatPrice(p) { return (p || 0).toLocaleString('fa-IR'); }  
        function showToast(msg, type='info') {  
            const c = document.getElementById('toastContainer'); if (!c) return;  
            const t = document.createElement('div'); t.className = `toast ${type}`; t.textContent = msg;  
            c.appendChild(t); setTimeout(() => t.remove(), 3000);  
        }  
        function getProductById(id) { return state.products.find(p => p.id === id); }  
        function getRecipeById(id) { return state.recipes.find(r => r.id === id); }
        function getEffectivePrice(product) {  
            const discount = product.discount || 0;
            return discount > 0 ? Math.round(product.price * (1 - discount/100)) : product.price;  
        }  

        function applyLayoutMode() {
            if (state.currentUser && state.currentUser.role === 'admin') document.body.classList.add('admin-mode');
            else document.body.classList.remove('admin-mode');
        }

        function updateHeaderLogoutButton() {
            const logoutBtn = document.getElementById('headerLogoutBtn');
            if (logoutBtn) {
                if (state.currentUser && state.currentUser.userCode) {
                    logoutBtn.classList.add('visible');
                } else {
                    logoutBtn.classList.remove('visible');
                }
            }
        }

        function showPage(page) {  
            state.activePage = page;  
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));  
            const el = document.getElementById(`page-${page}`); if (el) el.classList.add('active');  
            if (!state.currentUser || state.currentUser.role !== 'admin') {
                document.querySelectorAll('.bottom-nav-item').forEach(b => b.classList.remove('active'));  
                const navMap = { home: 0, shop: 1, kitchen: 2, cart: 3, 'user-dashboard': 4 };  
                if (navMap[page] !== undefined) {  
                    const items = document.querySelectorAll('.bottom-nav-item');  
                    if (items[navMap[page]]) items[navMap[page]].classList.add('active');  
                }  
            }
            if (page === 'welcome') renderWelcomeCard();
            else if (page === 'home') renderHome();  
            else if (page === 'shop') renderShop();  
            else if (page === 'kitchen') renderKitchen();
            else if (page === 'cart') renderCart();  
            else if (page === 'complete-profile') renderCompleteProfile();
            else if (page === 'login') renderLogin();
            else if (page === 'eitaa-warning') renderEitaaWarning();
            else if (page === 'user-dashboard') renderUserDashboard();  
            else if (page === 'admin') renderAdminDashboard();  
            updateCartBadge(); applyLayoutMode(); updateHeaderLogoutButton(); saveState();  
        }  

        function updateCartBadge() {  
            const count = state.cart.reduce((s, i) => s + (i.quantity || 0), 0);  
            const badge = document.getElementById('bottomCartBadge');  
            if (badge) { badge.style.display = count > 0 ? 'flex' : 'none'; badge.textContent = count; }  
        }  

        function handleGlobalSearch(query) {  
            if (!query || query.length < 2) return;  
            showPage('shop'); renderShop(query.toLowerCase());  
        }  

        function toggleAdminSidebar() {  
            document.getElementById('adminSidebar').classList.toggle('open');  
            document.getElementById('adminBackdrop').classList.toggle('show');  
        }  

        function renderEitaaWarning() {
            const container = document.getElementById('eitaaWarningContainer');

        function applyDiscountCode(code) { const discount = state.discounts.find(d => d.code === code && d.active); if (!discount) { showToast('کد تخفیف نامعتبر است', 'error'); return false; } state.appliedDiscount = discount; showToast(`تخفیف ${discount.percent}٪ اعمال شد!`, 'success'); return true; }

        function addRecipeSpicesToCart(recipeId) {
            const recipe = getRecipeById(recipeId); if (!recipe) return;

                const product = getProductById(spiceId);
                if (product) {
                    const existing = state.cart.find(item => item.productId === spiceId);
                    if (existing) existing.quantity += 1; else state.cart.push({ productId: spiceId, quantity: 1 });

        function renderCart() {  
            const container = document.getElementById('cartContent');  
            if (!container) return;
            if (state.cart.length === 0) { container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-shopping-cart"></i><p>سبد خالی است</p><button class="btn btn-primary btn-sm" onclick="showPage('shop')">رفتن به فروشگاه</button></div>`; return; }  
            let subtotal = state.cart.reduce((sum, item) => { const p = getProductById(item.productId); return sum + (p ? getEffectivePrice(p) * item.quantity : 0); }, 0);
            const discountAmount = calculateDiscount();
            const shipping = state.settings.shippingCost || 0;
            const vat = Math.round(((subtotal - discountAmount) * (state.settings.vatPercent || 0)) / 100);
            const total = subtotal - discountAmount + shipping + vat;
            const itemsHTML = state.cart.map(item => {  
                const product = getProductById(item.productId); if (!product) return '';  
                const price = getEffectivePrice(product); const subtotalItem = price * item.quantity;

            }).join('');  
            container.innerHTML = `${itemsHTML}<div class="checkout-summary"><div class="checkout-row"><span>جمع:</span><span>${formatPrice(subtotal)} تومان</span></div>${discountAmount > 0 ? `<div class="checkout-row" style="color:var(--green);"><span>تخفیف:</span><span>-${formatPrice(discountAmount)} تومان</span></div>` : ''}<div class="checkout-row"><span>ارسال:</span><span>${formatPrice(shipping)} تومان</span></div><div class="checkout-row"><span>مالیات:</span><span>${formatPrice(vat)} تومان</span></div><div class="checkout-row total"><span>مبلغ قابل پرداخت:</span><span>${formatPrice(total)} تومان</span></div></div><div style="background:#fff;border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:12px;"><label style="font-size:0.9rem;font-weight:700;display:block;margin-bottom:8px;">کد تخفیف:</label><div class="discount-input-group"><input type="text" id="discountCodeInput" placeholder="کد تخفیف"><button class="btn btn-primary btn-sm" onclick="applyDiscountFromInput()">اعمال</button></div>${state.appliedDiscount ? `<div class="discount-applied"><i class="fa-solid fa-check"></i> تخفیف ${state.appliedDiscount.percent}٪ اعمال شد <button onclick="removeDiscount()" style="background:none;color:#fff;border:none;float:left;cursor:pointer;"><i class="fa-solid fa-xmark"></i></button></div>` : ''}</div><div style="background:#fff;border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow-sm);"><button class="btn btn-primary btn-block" onclick="showCheckoutModal()">تسویه حساب</button></div>`;  
        }  

        function applyDiscountFromInput() { const code = document.getElementById('discountCodeInput').value.trim(); if (applyDiscountCode(code)) renderCart(); }

        function showCheckoutModal() {
            if (!state.currentUser) { showToast('لطفاً ابتدا ثبت‌نام کنید', 'error'); showPage('complete-profile'); return; }
            if (!state.currentUser.phone || !state.currentUser.address) { showToast('لطفاً اطلاعات خود را تکمیل کنید', 'error'); showPage('complete-profile'); return; }
            let subtotal = state.cart.reduce((sum, item) => { const p = getProductById(item.productId); return sum + (p ? getEffectivePrice(p) * item.quantity : 0); }, 0);
            const discountAmount = calculateDiscount();
            const shipping = state.settings.shippingCost || 0;
            const vat = Math.round(((subtotal - discountAmount) * (state.settings.vatPercent || 0)) / 100);
            const total = subtotal - discountAmount + shipping + vat;

            document.getElementById('modalContainer').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:550px;"><button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button><h3 style="margin-bottom:16px;">تسویه حساب</h3><div style="background:var(--cream);padding:12px;border-radius:var(--radius-sm);margin-bottom:16px;font-size:0.9rem;"><strong>نام:</strong> ${state.currentUser.name}<br><strong>تلفن:</strong> ${state.currentUser.phone}<br><strong>آدرس:</strong> ${state.currentUser.address}، ${state.currentUser.city}</div><div class="checkout-summary" id="checkoutSummary"><div class="checkout-row"><span>جمع:</span><span>${formatPrice(subtotal)} تومان</span></div>${discountAmount > 0 ? `<div class="checkout-row" style="color:var(--green);"><span>تخفیف:</span><span>-${formatPrice(discountAmount)} تومان</span></div>` : ''}<div class="checkout-row"><span>ارسال:</span><span>${formatPrice(shipping)} تومان</span></div><div class="checkout-row"><span>مالیات:</span><span>${formatPrice(vat)} تومان</span></div><div class="checkout-row total"><span>مبلغ قابل پرداخت:</span><span>${formatPrice(total)} تومان</span></div></div><div style="margin-bottom:16px;"><div style="background:var(--cream);padding:12px;border-radius:var(--radius-sm);"><div style="font-weight:700;margin-bottom:8px;">💳 شماره کارت فروشگاه:</div><div style="font-family:monospace;font-size:1.1rem;direction:ltr;text-align:center;">${state.settings.storeCardNumber}</div><div style="text-align:center;margin-top:8px;">${state.settings.storeCardName}</div><button class="btn btn-secondary btn-sm btn-block" style="margin-top:8px;" onclick="copyToClipboard('${state.settings.storeCardNumber}')"><i class="fa-regular fa-copy"></i> کپی شماره کارت</button></div></div><div style="margin-bottom:16px;"><label style="font-size:0.85rem;font-weight:700;">شماره کارت شما:</label><input type="text" id="userCardNumber" placeholder="16 رقم" maxlength="19" style="margin-bottom:12px; direction:ltr; text-align:left;"></div><div style="margin-bottom:16px;"><label style="font-size:0.85rem;font-weight:700;">ارسال فیش واریزی:</label><select id="receiptType" onchange="toggleReceiptType()" style="margin-bottom:8px;"><option value="text">توضیحات متنی (شماره پیگیری)</option><option value="image">آپلود تصویر فیش</option></select><textarea id="receiptText" placeholder="شماره پیگیری تراکنش..." style="margin-bottom:12px;"></textarea><input type="file" id="receiptImage" accept="image/*" style="display:none;margin-bottom:12px;"></div><button class="btn btn-primary btn-block" onclick="processOrder(${subtotal}, ${discountAmount}, ${shipping}, ${vat}, ${total})"><i class="fa-solid fa-check-circle"></i> ثبت سفارش نهایی</button></div></div>`;
        }

        function toggleReceiptType() { const type = document.getElementById('receiptType').value; document.getElementById('receiptText').style.display = type === 'text' ? 'block' : 'none'; document.getElementById('receiptImage').style.display = type === 'image' ? 'block' : 'none'; }
        function copyToClipboard(text) { if (!text) return; navigator.clipboard.writeText(text).then(() => showToast('کپی شد', 'success')); }

        // ارسال سفارش به کانال ایتا
        async function sendOrderToEitaa(order) {
            const channelId = state.settings.adminChatId || EITAA_CHANNEL_ID;
            
            const itemsText = order.items.map(item => {
                const p = getProductById(item.productId);
                return `• ${p ? p.name : 'محصول'} - ${item.quantity} عدد - ${formatPrice(getEffectivePrice(p) * item.quantity)} تومان`;
            }).join('\n');

            const message = `
🛒 <b>سفارش جدید!</b>

👤 <b>نام:</b> ${order.userName}
📞 <b>تلفن:</b> ${order.userPhone}
📍 <b>آدرس:</b> ${order.userAddress}
📮 <b>کد پستی:</b> ${order.userPostalCode || 'ندارد'}

🛍️ <b>اقلام:</b>
${itemsText}

💰 <b>جمع:</b> ${formatPrice(order.subtotal)} تومان
${order.discount > 0 ? `🎁 <b>تخفیف:</b> ${formatPrice(order.discount)} تومان\n` : ''} <b>ارسال:</b> ${formatPrice(order.shipping)} تومان
 <b>مالیات:</b> ${formatPrice(order.vat)} تومان
💳 <b>کل:</b> ${formatPrice(order.total)} تومان

💳 <b>روش پرداخت:</b> کارت به کارت
📝 <b>فیش:</b> ${order.receiptInfo}
            `.trim();

            try {
                const response = await fetch(`${EITAA_API_URL}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: channelId,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
                const data = await response.json();
                if (data.ok) {
                    showToast('سفارش به کانال ارسال شد ✅', 'success');
                    return true;
                } else {
                    console.error('Eitaa API error:', data);
                    showToast('خطا در ارسال به کانال', 'error');
                    return false;
                }
            } catch(e) {
                console.error('Fetch error:', e);
                showToast('خطا در اتصال به ایتا', 'error');
                return false;
            }
        }

        async function processOrder(subtotal, discountAmount, shipping, vat, total) {
            const userCard = document.getElementById('userCardNumber').value;
            if (userCard.replace(/\s/g, '').length < 16) { showToast('شماره کارت را وارد کنید', 'error'); return; }
            
            const rType = document.getElementById('receiptType').value;
            let receiptInfo = '';
            if (rType === 'text') { 
                receiptInfo = document.getElementById('receiptText').value; 
                if (!receiptInfo) { showToast('شماره پیگیری را وارد کنید', 'error'); return; } 
            } else { 
                const file = document.getElementById('receiptImage').files[0]; 
                if (!file) { showToast('تصویر فیش را انتخاب کنید', 'error'); return; } 
                receiptInfo = 'تصویر فیش ارسال شد'; 
            }
            receiptInfo = `کارت: ${userCard} | ${receiptInfo}`;

            let finalTotal = total;
            const order = { id: generateId(), userId: state.currentUser.id, userName: state.currentUser.name, userPhone: state.currentUser.phone, userAddress: state.currentUser.address + '، ' + state.currentUser.city, userPostalCode: state.currentUser.postalCode, items: JSON.parse(JSON.stringify(state.cart)), subtotal: subtotal, discount: discountAmount, discountCode: state.appliedDiscount ? state.appliedDiscount.code : '', shipping: shipping, vat: vat, total: finalTotal, receiptInfo: receiptInfo, status: 'pending_payment', trackingCode: '', createdAt: Date.now() };
            
            state.orders.push(order); 
            state.currentUser.firstPurchaseDone = true;
            const userIdx = state.users.findIndex(u => u.id === state.currentUser.id); 
            if (userIdx !== -1) state.users[userIdx] = { ...state.currentUser };
            state.cart = []; state.appliedDiscount = null; 
            saveState(); updateCartBadge(); closeModal();
            
            // ارسال به کانال ایتا
            const sent = await sendOrderToEitaa(order);
            
            if (sent) {
                showToast('سفارش ثبت و به کانال ارسال شد 🎉', 'success');
            } else {
                showToast('سفارش ثبت شد (ارسال به کانال ناموفق بود)', 'success');
            }
            showPage('user-dashboard');
        }

            }
        }

            }
            else if (tab === 'recipes') {
                container.innerHTML = `<div style="display:flex;justify-content:space-between;margin-bottom:12px;"><h4>دستور پخت‌ها (${state.recipes.length})</h4><button class="btn btn-primary btn-sm" onclick="showAddRecipeForm()">+ دستور پخت</button></div>${state.recipes.map(r => `<div style="background:#fff;border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:10px;"><div style="font-size:2rem;">${r.icon}</div><div style="flex:1;"><strong>${r.title}</strong><br><span style="font-size:0.8rem;">${r.cookTime} | ${r.servings}</span></div><button class="btn btn-secondary btn-sm" onclick="showEditRecipeForm('${r.id}')">✏️</button><button class="btn btn-danger btn-sm" onclick="deleteRecipe('${r.id}')">🗑️</button></div>`).join('')}`;
            }
            else if (tab === 'settings') { 
                container.innerHTML = `<div style="background:#fff;border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow-sm);">
                    <h4 style="margin-bottom:16px;">⚙️ تنظیمات</h4>
                    <form onsubmit="saveSettings(event)">
                        <div style="margin-bottom:12px;"><label>هزینه ارسال:</label><input type="number" id="setShipping" value="${state.settings.shippingCost}" required></div>
                        <div style="margin-bottom:12px;"><label>مالیات (%):</label><input type="number" id="setVat" value="${state.settings.vatPercent}" required></div>
                        <hr style="margin:16px 0;border:0;border-top:1px solid var(--border);">
                        <div style="margin-bottom:12px;"><label>شماره کارت:</label><input type="text" id="setCardNum" value="${state.settings.storeCardNumber}" placeholder="16 رقم" maxlength="16"></div>
                        <div style="margin-bottom:12px;"><label>نام صاحب:</label><input type="text" id="setCardName" value="${state.settings.storeCardName}"></div>
                        <hr style="margin:16px 0;border:0;border-top:1px solid var(--border);">
                        <div style="margin-bottom:12px;"><label style="font-size:0.85rem;color:var(--text-light);">📢 شناسه کانال ایتا (برای دریافت سفارشات):</label><input type="text" id="setAdminChatId" value="${state.settings.adminChatId || EITAA_CHANNEL_ID}" placeholder="11239803"></div>
                        <p style="font-size:0.75rem;color:var(--text-light);margin-bottom:12px;">⚠️ ربات باید ادمین کانال باشد تا بتواند پیام ارسال کند</p>
                        <button class="btn btn-primary btn-block" style="margin-top:8px;">ذخیره</button>
                    </form>
                </div>`; 
            }
            saveState();  
        }

        function showAddRecipeForm() {
            const c = document.getElementById('adminTabContent');
            const shelves = [
                { id: 'iranian', name: 'غذاهای ایرانی', icon: '🇮🇷' },
                { id: 'international', name: 'بین‌المللی', icon: '' },
                { id: 'appetizer', name: 'پیش‌غذا', icon: '🥗' },
                { id: 'soup', name: 'سوپ و آش', icon: '🥣' },
                { id: 'kebab', name: 'کباب', icon: '🍗' },
                { id: 'pasta', name: 'پاستا', icon: '🍝' },
                { id: 'dessert', name: 'دسر', icon: '🍰' },
                { id: 'drink', name: 'نوشیدنی', icon: '' },
                { id: 'breakfast', name: 'صبحانه', icon: '' },
                { id: 'salad', name: 'سالاد', icon: '🥬' },
            ];
            c.innerHTML = `<div style="background:#fff;border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow-sm);"><h4>دستور پخت جدید</h4><form onsubmit="addRecipe(event)"><input type="text" id="recipeTitle" placeholder="عنوان غذا" required><input type="text" id="recipeIcon" placeholder="ایموجی" value="🍲" required style="margin-top:8px;"><textarea id="recipeDesc" placeholder="توضیحات (بالای 50 کاراکتر)" required style="margin-top:8px;min-height:100px;"></textarea><div style="margin-top:8px;"><label style="font-size:0.85rem;font-weight:700;">دسته:</label><select id="recipeShelf" style="margin-top:6px;">${shelves.map(s => `<option value="${s.id}">${s.icon} ${s.name}</option>`).join('')}</select></div><div style="display:flex;gap:8px;margin-top:8px;"><input type="text" id="recipeTime" placeholder="زمان" required style="flex:1;"><input type="text" id="recipeServings" placeholder="نفرات" required style="flex:1;"><input type="text" id="recipeDifficulty" placeholder="سختی" required style="flex:1;"></div><div style="margin-top:12px;"><label style="font-size:0.85rem;font-weight:700;">ادویه‌ها:</label><div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-top:6px;">${state.products.map(p => `<label style="display:flex;align-items:center;gap:8px;padding:6px;border-bottom:1px solid var(--border);font-size:0.9rem;"><input type="checkbox" value="${p.id}" class="recipe-spice-check"> ${p.icon} ${p.name}</label>`).join('')}</div></div><div style="margin-top:12px;"><label style="font-size:0.85rem;font-weight:700;">مواد لازم (هر خط یک مورد):</label><textarea id="recipeIngredients" rows="4" required style="margin-top:6px;"></textarea></div><div style="margin-top:12px;"><label style="font-size:0.85rem;font-weight:700;">مراحل (هر خط یک مرحله):</label><textarea id="recipeSteps" rows="6" required style="margin-top:6px;"></textarea></div><button class="btn btn-primary btn-block" style="margin-top:12px;">افزودن</button></form></div>`;
        }

        function addRecipe(e) {
            e.preventDefault();
            const spiceChecks = document.querySelectorAll('.recipe-spice-check:checked');
            const spices = Array.from(spiceChecks).map(cb => cb.value);
            const ingredients = document.getElementById('recipeIngredients').value.split('\n').filter(i => i.trim());
            const steps = document.getElementById('recipeSteps').value.split('\n').filter(s => s.trim());
            const recipe = { id: generateId(), title: document.getElementById('recipeTitle').value, icon: document.getElementById('recipeIcon').value, description: document.getElementById('recipeDesc').value, shelf: document.getElementById('recipeShelf').value, cookTime: document.getElementById('recipeTime').value, servings: document.getElementById('recipeServings').value, difficulty: document.getElementById('recipeDifficulty').value, spices: spices, ingredients: ingredients, steps: steps };
            state.recipes.push(recipe); saveState(); showToast('اضافه شد', 'success'); showAdminTab('recipes');
        }

        function showEditRecipeForm(id) {
            const r = getRecipeById(id); if (!r) return;
            const c = document.getElementById('adminTabContent');
            const shelves = [
                { id: 'iranian', name: 'غذاهای ایرانی', icon: '🇮🇷' },
                { id: 'international', name: 'بین‌المللی', icon: '🌍' },
                { id: 'appetizer', name: 'پیش‌غذا', icon: '🥗' },
                { id: 'soup', name: 'سوپ و آش', icon: '🥣' },
                { id: 'kebab', name: 'کباب', icon: '🍗' },
                { id: 'pasta', name: 'پاستا', icon: '🍝' },
                { id: 'dessert', name: 'دسر', icon: '🍰' },
                { id: 'drink', name: 'نوشیدنی', icon: '' },
                { id: 'breakfast', name: 'صبحانه', icon: '🍳' },
                { id: 'salad', name: 'سالاد', icon: '🥬' },
            ];
            c.innerHTML = `<div style="background:#fff;border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow-sm);"><h4>ویرایش: ${r.title}</h4><form onsubmit="editRecipe(event, '${id}')"><input type="text" id="recipeTitle" value="${r.title}" required><input type="text" id="recipeIcon" value="${r.icon}" required style="margin-top:8px;"><textarea id="recipeDesc" style="margin-top:8px;" required>${r.description}</textarea><div style="margin-top:8px;"><label style="font-size:0.85rem;font-weight:700;">دسته:</label><select id="recipeShelf" style="margin-top:6px;">${shelves.map(s => `<option value="${s.id}" ${s.id === r.shelf ? 'selected' : ''}>${s.icon} ${s.name}</option>`).join('')}</select></div><div style="display:flex;gap:8px;margin-top:8px;"><input type="text" id="recipeTime" value="${r.cookTime}" required style="flex:1;"><input type="text" id="recipeServings" value="${r.servings}" required style="flex:1;"><input type="text" id="recipeDifficulty" value="${r.difficulty}" required style="flex:1;"></div><div style="margin-top:12px;"><label style="font-size:0.85rem;font-weight:700;">ادویه‌ها:</label><div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-top:6px;">${state.products.map(p => `<label style="display:flex;align-items:center;gap:8px;padding:6px;border-bottom:1px solid var(--border);font-size:0.9rem;"><input type="checkbox" value="${p.id}" class="recipe-spice-check" ${r.spices.includes(p.id) ? 'checked' : ''}> ${p.icon} ${p.name}</label>`).join('')}</div></div><div style="margin-top:12px;"><label style="font-size:0.85rem;font-weight:700;">مواد لازم:</label><textarea id="recipeIngredients" rows="4" required style="margin-top:6px;">${r.ingredients.join('\n')}</textarea></div><div style="margin-top:12px;"><label style="font-size:0.85rem;font-weight:700;">مراحل:</label><textarea id="recipeSteps" rows="6" required style="margin-top:6px;">${r.steps.join('\n')}</textarea></div><button class="btn btn-primary btn-block" style="margin-top:12px;">ذخیره</button></form></div>`;
        }

        function editRecipe(e, id) {
            e.preventDefault();
            const r = getRecipeById(id);
            const spiceChecks = document.querySelectorAll('.recipe-spice-check:checked');
            r.title = document.getElementById('recipeTitle').value; r.icon = document.getElementById('recipeIcon').value; r.description = document.getElementById('recipeDesc').value; r.shelf = document.getElementById('recipeShelf').value; r.cookTime = document.getElementById('recipeTime').value; r.servings = document.getElementById('recipeServings').value; r.difficulty = document.getElementById('recipeDifficulty').value; r.spices = Array.from(spiceChecks).map(cb => cb.value); r.ingredients = document.getElementById('recipeIngredients').value.split('\n').filter(i => i.trim()); r.steps = document.getElementById('recipeSteps').value.split('\n').filter(s => s.trim());
            saveState(); showToast('بروزرسانی شد', 'success'); showAdminTab('recipes');
        }

        function deleteRecipe(id) { if(confirm('حذف شود؟')) { state.recipes = state.recipes.filter(r => r.id !== id); saveState(); showAdminTab('recipes'); } }

        function showAddProductForm() { const c = document.getElementById('adminTabContent'); c.innerHTML = `<div style="background:#fff;border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow-sm);"><h4>محصول جدید</h4><form onsubmit="addProduct(event)"><input type="text" id="prodName" placeholder="نام" required><input type="text" id="prodIcon" placeholder="ایموجی" value="🌶️" required style="margin-top:8px;"><textarea id="prodDesc" placeholder="توضیحات" style="margin-top:8px;" required></textarea><textarea id="prodUses" placeholder="کاربردها" style="margin-top:8px;" required></textarea><div style="margin-top:8px;"><label style="font-size:0.8rem;">قیمت 100 گرم</label><input type="number" id="w1Price" placeholder="قیمت" required style="margin-top:4px;"></div><div style="margin-top:8px;"><label style="font-size:0.8rem;">درصد تخفیف</label><input type="number" id="prodDiscount" placeholder="درصد" value="0" style="margin-top:4px;"></div><button class="btn btn-primary btn-sm" style="margin-top:12px;width:100%;">افزودن</button></form></div>`; }
        function addProduct(e) { e.preventDefault(); const price = parseInt(document.getElementById('w1Price').value) || 0; const discount = parseInt(document.getElementById('prodDiscount').value) || 0; const p = { id: generateId(), name: document.getElementById('prodName').value, icon: document.getElementById('prodIcon').value, fullDescription: document.getElementById('prodDesc').value, uses: document.getElementById('prodUses').value, discount: discount, price: price, foods: [] }; state.products.push(p); saveState(); showToast('اضافه شد', 'success'); showAdminTab('products'); }
        function showEditProductForm(id) { const p = getProductById(id); if (!p) return; const c = document.getElementById('adminTabContent'); c.innerHTML = `<div style="background:#fff;border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow-sm);"><h4>ویرایش: ${p.name}</h4><form onsubmit="editProduct(event, '${id}')"><input type="text" id="prodName" value="${p.name}" required><input type="text" id="prodIcon" value="${p.icon}" required style="margin-top:8px;"><textarea id="prodDesc" style="margin-top:8px;">${p.fullDescription || ''}</textarea><textarea id="prodUses" style="margin-top:8px;">${p.uses || ''}</textarea><div style="margin-top:8px;"><label style="font-size:0.8rem;">قیمت 100 گرم</label><input type="number" id="w1Price" value="${p.price || 0}" required style="margin-top:4px;"></div><div style="margin-top:8px;"><label style="font-size:0.8rem;">درصد تخفیف</label><input type="number" id="prodDiscount" value="${p.discount || 0}" style="margin-top:4px;"></div><button class="btn btn-primary btn-sm" style="margin-top:12px;width:100%;">ذخیره</button></form></div>`; }
        function editProduct(e, id) { e.preventDefault(); const p = getProductById(id); p.name = document.getElementById('prodName').value; p.icon = document.getElementById('prodIcon').value; p.fullDescription = document.getElementById('prodDesc').value; p.uses = document.getElementById('prodUses').value; p.price = parseInt(document.getElementById('w1Price').value) || 0; p.discount = parseInt(document.getElementById('prodDiscount').value) || 0; saveState(); showToast('بروزرسانی شد', 'success'); showAdminTab('products'); }
        function deleteProduct(id) { if(confirm('حذف شود؟')) { state.products = state.products.filter(p => p.id !== id); saveState(); showAdminTab('products'); } }
        function deleteUser(id) { if(confirm('حذف شود؟')) { state.users = state.users.filter(u => u.id !== id); saveState(); showAdminTab('users'); } }
        function copyUserCredentials(userCode, password) { const text = `کد کاربری: ${userCode}\nرمز عبور: ${password}`; navigator.clipboard.writeText(text).then(() => showToast('کپی شد', 'success')); }
        function updateOrderStatus(id, status) { const o = state.orders.find(x => x.id === id); if (o) { o.status = status; saveState(); showToast('بروزرسانی شد', 'success'); } }
        function updateTrackingCode(id, code) { const o = state.orders.find(x => x.id === id); if (o) { o.trackingCode = code; saveState(); showToast('ذخیره شد', 'success'); } }
        function saveSettings(e) { e.preventDefault(); state.settings.shippingCost = parseInt(document.getElementById('setShipping').value) || 0; state.settings.vatPercent = parseInt(document.getElementById('setVat').value) || 0; state.settings.storeCardNumber = document.getElementById('setCardNum').value.replace(/\s/g, ''); state.settings.storeCardName = document.getElementById('setCardName').value; state.settings.adminChatId = document.getElementById('setAdminChatId').value; saveState(); showToast('ذخیره شد', 'success'); }

        function init() {  
            loadState();  
            if (state.currentUser && state.currentUser.userId) {
                if (state.currentUser.role === 'admin') showPage('admin');
                else showPage('home');
                updateCartBadge();
                return;
            }
            if (eitaaUser) {
                const userId = eitaaUser.id;
                if (userId === ADMIN_EITAA_ID && ADMIN_EITAA_ID !== 123456789) {
                    let adminUser = state.users.find(u => u.role === 'admin');
                    if (!adminUser) { adminUser = { id: 'admin_local', userId: userId, name: 'مدیر', phone: '09120000000', role: 'admin', address: '', postalCode: '', city: '', firstPurchaseDone: true, createdAt: Date.now() }; state.users.push(adminUser); }
                    state.currentUser = adminUser; saveState(); showPage('admin'); return;
                }
                let user = state.users.find(u => u.userId === userId);
                if (!user) {
                    user = { id: `user_${userId}`, userId: userId, userCode: null, password: null, name: eitaaUser.first_name || 'کاربر', phone: '', city: '', address: '', postalCode: '', role: 'user', firstPurchaseDone: false, createdAt: Date.now() };
                    state.users.push(user); state.currentUser = user; saveState();
                    if (state.welcomeCard.active) showPage('welcome'); else showPage('complete-profile');
                } else {
                    state.currentUser = user; saveState();
                    if (state.welcomeCard.active && !user.firstPurchaseDone) showPage('welcome');
                    else if (!user.phone || !user.address) showPage('complete-profile');
                    else showPage('home');
                }
            } else {
                if (isFromEitaa) showPage('login'); else showPage('eitaa-warning');
            }
            updateCartBadge();  
        }  
        
        init();  
    </script>
</body>  
</html>
